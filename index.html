<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mesa Finanzas Bot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
html{color-scheme:light}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}
/* Layout: barra de activos arriba, vista resumen (tabla + curvas base 100) o ficha por activo con pestañas Intradía / Diario / Semanal */
:root{
  --bg:#f3f5f8; --panel:#ffffff; --ink:#132033; --muted:#5b6b82; --line:#dbe1ea; --grid:#e9edf3;
  --accent:#1f5fbf; --accent-soft:#e3ecfa; --up:#0f8a5f; --down:#c73a3a; --warn:#b26a00; --band:rgba(31,95,191,.08);
  --f-display:"Archivo","Helvetica Neue",Arial,sans-serif; --f-body:"IBM Plex Sans","Segoe UI",Roboto,sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d131c; --panel:#141c27; --ink:#e4eaf3; --muted:#8d9bb0; --line:#243042; --grid:#1c2633;
  --accent:#6aa3ff; --accent-soft:#1a2b45; --up:#3fcf95; --down:#ff7272; --warn:#f0b24a; --band:rgba(106,163,255,.10); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d131c; --panel:#141c27; --ink:#e4eaf3; --muted:#8d9bb0; --line:#243042; --grid:#1c2633;
  --accent:#6aa3ff; --accent-soft:#1a2b45; --up:#3fcf95; --down:#ff7272; --warn:#f0b24a; --band:rgba(106,163,255,.10); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45}
.wrap{max-width:1240px;margin:0 auto;padding-inline:16px;padding-block:16px 40px;display:flex;flex-direction:column;gap:18px}
header.top{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px 16px}
h1{font-family:var(--f-display);font-weight:800;font-size:1.55rem;letter-spacing:-.01em;margin:0;text-wrap:balance}
h1 small{font-weight:500;color:var(--muted);font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;margin-left:8px}
.src{color:var(--muted);font-size:.8rem}
nav.tickers{display:flex;flex-wrap:wrap;gap:6px}
nav.tickers a{font-family:var(--f-mono);font-size:.8rem;text-decoration:none;color:var(--ink);border:1px solid var(--line);background:var(--panel);padding:4px 9px;border-radius:4px;display:inline-flex;gap:6px;align-items:center}
nav.tickers a:hover{border-color:var(--accent)}
nav.tickers a[aria-current="page"]{background:var(--accent);border-color:var(--accent);color:var(--panel)}
nav.tickers .brk{flex-basis:100%;height:0}
nav.tickers a .dot{width:6px;height:6px;border-radius:50%;background:var(--muted)}
nav.tickers a .dot.up{background:var(--up)} nav.tickers a .dot.down{background:var(--down)}
nav.tickers a[aria-current="page"] .dot{background:var(--panel)}
a:focus-visible,button:focus-visible,select:focus-visible,th:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px;min-width:0}
.panel h2{font-family:var(--f-display);font-weight:700;font-size:1.05rem;margin:0 0 4px}
.panel .sub{color:var(--muted);font-size:.8rem;margin:0 0 12px}
.grid2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:18px}
@media (max-width:900px){.grid2{grid-template-columns:minmax(0,1fr)}}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.up{color:var(--up)} .down{color:var(--down)} .muted{color:var(--muted)}
.tablebox{overflow-x:auto}.btin{display:none}@media (max-width:700px){.btcol{display:none}.btin{display:block;margin-top:6px;text-align:left}.btin .num{font-weight:600}}
table{border-collapse:collapse;width:100%;font-size:.85rem}
th,td{padding:7px 8px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font-weight:600;color:var(--muted);font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;cursor:pointer;user-select:none;position:sticky;top:0;background:var(--panel)}
th[aria-sort="ascending"]::after{content:" ▲"} th[aria-sort="descending"]::after{content:" ▼"}
tbody tr{cursor:pointer} tbody tr:hover{background:var(--accent-soft)}
td .tk{font-family:var(--f-mono);font-weight:500}
td .rb{display:block;color:var(--muted);font-size:.72rem}
.pill{display:inline-block;font-size:.7rem;padding:1px 7px;border-radius:999px;border:1px solid currentColor;font-family:var(--f-body)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:5px;overflow:hidden}
.seg button{font:inherit;font-size:.8rem;background:var(--panel);color:var(--ink);border:0;padding:5px 11px;cursor:pointer;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--panel)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.chart{width:100%;height:340px;position:relative}
.chart.sm{height:120px}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:.75rem;color:var(--muted);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:5px;cursor:pointer}
.legend i{width:12px;height:3px;border-radius:2px;display:inline-block}
.legend span.off{opacity:.35}
.bars{display:flex;flex-direction:column;gap:4px}
.bar{display:grid;grid-template-columns:52px 1fr 64px;align-items:center;gap:8px;font-size:.8rem}
.bar .track{position:relative;height:14px}
.bar .track .mid{position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:var(--line)}
.bar .track .fill{position:absolute;top:2px;height:10px;border-radius:2px}
.hero{display:flex;flex-wrap:wrap;gap:12px 28px;align-items:flex-end}
.hero .big{font-family:var(--f-display);font-size:2.2rem;font-weight:800;line-height:1}
.stat{display:flex;flex-direction:column;gap:2px}
.stat b{font-size:.68rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.levels{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.levels div{border:1px solid var(--line);border-radius:4px;padding:6px 8px;display:flex;justify-content:space-between;gap:6px;font-size:.8rem}
.note{font-size:.78rem;color:var(--muted);margin:8px 0 0}
.flag{color:var(--warn)}
select{font:inherit;font-size:.8rem;padding:4px 6px;border:1px solid var(--line);border-radius:4px;background:var(--panel);color:var(--ink)}
.toggles{display:flex;flex-wrap:wrap;gap:10px;font-size:.8rem;color:var(--muted)}
.toggles label{display:inline-flex;gap:4px;align-items:center;cursor:pointer}
.empty{color:var(--muted);padding:40px 0;text-align:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.sig{display:inline-block;font-size:.72rem;font-weight:600;padding:2px 8px;border-radius:4px;letter-spacing:.02em}
.sig-buy{background:var(--up);color:var(--panel)} .sig-sell{background:var(--down);color:var(--panel)}
.sig-long{border:1px solid var(--up);color:var(--up)} .sig-flat{border:1px solid var(--line);color:var(--muted)}
.alerts{display:flex;flex-wrap:wrap;gap:8px}
.alert{display:flex;flex-direction:column;gap:2px;text-decoration:none;color:var(--ink);border-radius:6px;padding:8px 12px;border:1px solid var(--line);flex:1 1 240px;min-width:0}
.alert.a-buy{border-color:var(--up);box-shadow:inset 3px 0 0 var(--up)} .alert.a-sell{border-color:var(--down);box-shadow:inset 3px 0 0 var(--down)}
.alert .rb,.sigbox .rb{display:block;color:var(--muted);font-size:.75rem}
.sigbox{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:baseline}
.btn{font:inherit;font-size:.8rem;border:1px solid var(--accent);color:var(--accent);background:var(--panel);border-radius:5px;padding:5px 11px;cursor:pointer}
.btn:hover{background:var(--accent-soft)}
.status{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;font-size:.8rem;color:var(--muted);border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:8px 12px}
.status .led{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.status .led.ok{background:var(--up)} .status .led.bad{background:var(--down)} .status .led.busy{background:var(--warn)}
.status .msg{flex:1 1 260px;min-width:0}
/* Laboratorio */
.lab-top{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;font-size:.8rem;color:var(--muted);margin:12px 0}
.lab-top label{display:inline-flex;gap:6px;align-items:center}
.lab-h{font-size:.8rem;font-weight:600;margin:14px 0 6px}
.lnk{font:inherit;font-size:.75rem;font-weight:400;background:none;border:0;color:var(--accent);cursor:pointer;padding:0 4px;text-decoration:underline}
.lab-assets{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;gap:5px;align-items:center;font-family:var(--f-mono);font-size:.78rem;border:1px solid var(--line);border-radius:5px;padding:4px 8px;cursor:pointer;background:var(--panel)}
.chip:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.grid-rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:14px;margin-top:14px}
.lab-rule{border:1px solid var(--line);border-radius:6px;padding:10px 12px}
.lab-rule h3{font-size:.9rem;margin:0}
.lab-rule .sub{margin:6px 0 8px}
.lab-cond{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:7px 0;border-top:1px solid var(--line);font-size:.8rem}
.lab-expr{display:inline-flex;flex-wrap:wrap;gap:5px;align-items:center;flex:1 1 220px}
.lab-n{font:inherit;font-family:var(--f-mono);font-size:.8rem;width:4.6em;padding:3px 5px;border:1px solid var(--line);border-radius:4px;background:var(--panel);color:var(--ink)}
.lab-x{font:inherit;background:none;border:1px solid var(--line);border-radius:4px;color:var(--muted);cursor:pointer;width:26px;height:26px;margin-left:auto}
.lab-x:hover{color:var(--down);border-color:var(--down)}
.lab-rule .btn{margin-top:8px}
.lab-info{flex:1 1 100%;font-size:.78rem}
.lab-info summary{cursor:pointer;color:var(--accent);list-style:none;display:inline}
.lab-info summary::before{content:"ⓘ ";}
.lab-info[open] summary{font-weight:600}
.lab-dl{margin:6px 0 2px;display:grid;grid-template-columns:max-content 1fr;gap:4px 10px;color:var(--ink);background:var(--accent-soft);border-radius:5px;padding:8px 10px}
.lab-dl dt{font-weight:600;color:var(--muted)} .lab-dl dd{margin:0}
@media (max-width:700px){.lab-dl{grid-template-columns:1fr}.lab-dl dd{margin-bottom:4px}}
.lab-guide{margin-top:6px;font-size:.85rem}
.lab-guide>summary{cursor:pointer;font-weight:600;color:var(--accent)}
.lab-guide .lab-info{display:block;padding:5px 0;border-top:1px solid var(--line)}
.lab-guide .lab-info summary{color:var(--ink)}
.lab-cond>select[data-f=k]{max-width:230px}
@media (max-width:700px){.lab-cond>select{flex:1 1 100%;max-width:none!important}.lab-rule .seg button{padding:5px 8px}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>Mesa Finanzas Bot <small id="asof"></small></h1>
    <span class="src">Precios de Yahoo Finance, actualizados por GitHub cada 15 minutos en horario de mercado. Horas en hora de Chile.</span>
  </header>
  <div class="status" role="status"><span class="led busy" id="led"></span><span class="msg" id="smsg">Cargando datos…</span></div>
  <nav class="tickers" id="nav" aria-label="Activos"></nav>
  <main id="view"><p class="empty">Cargando datos…</p></main>
</div>

<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<script>
(function(){
const RUBRO={NVDA:'Tecnología electrónica',AMD:'Tecnología electrónica',WDC:'Tecnología electrónica',MU:'Tecnología electrónica',SNDK:'Tecnología electrónica',ASTS:'Comunicaciones',LUNR:'Aeroespacial y defensa',HYMC:'Metales preciosos',MP:'Imanes',DELL:'Hardware',INTC:'Semiconductores',AEHR:'Semiconductores',AXTI:'Semiconductores',NTAP:'Almacenamiento',SPCX:'Aeroespacial',QQQ:'ETF Nasdaq 100',STX:'Almacenamiento',FLEX:'Manufactura electrónica',DDOG:'Software',ACWI:'ETF acciones mundiales (MSCI ACWI)',SP500:'Índice S&P 500',NASDAQ:'Índice Nasdaq Compuesto'};
const ALL=['QQQ','NVDA','AMD','INTC','MU','SNDK','WDC','STX','NTAP','DELL','FLEX','AEHR','AXTI','DDOG','ASTS','LUNR','SPCX','HYMC','MP','ACWI','SP500','NASDAQ'];
// Momentos de la sesión que seguía la planilla, medidos desde la apertura de Nueva York (9:30)
const SLOTS=[['Apertura',0],['+5 min',5],['+15 min',15],['+30 min',30],['+45 min',45],['+60 min',60]];
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const fmt=(x,d=2)=>x==null||!isFinite(x)?'–':x.toLocaleString('es-CL',{minimumFractionDigits:d,maximumFractionDigits:d});
const fmtInt=x=>x==null||!isFinite(x)?'–':Math.round(x).toLocaleString('es-CL');
const pct=x=>x==null||!isFinite(x)?'–':(x>0?'+':'')+fmt(x*100,2)+'%';
const cls=x=>x==null||!isFinite(x)?'muted':x>=0?'up':'down';
const MES=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const fdate=s=>{if(!s)return'–';const [y,m,d]=s.split('-');return `${d}-${MES[+m-1]}-${y.slice(2)}`};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const tzParts=(epoch,tz)=>{const o={};new Intl.DateTimeFormat('en-US',{timeZone:tz,hourCycle:'h23',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit'}).formatToParts(new Date(epoch*1000)).forEach(p=>o[p.type]=p.value);return o};
const tzOffset=(epoch,tz)=>{const p=tzParts(epoch,tz);return(Date.UTC(+p.year,+p.month-1,+p.day,+p.hour%24,+p.minute,+p.second)/1000)-epoch};
const clTime=epoch=>{const p=tzParts(epoch,'America/Santiago');return`${p.hour}:${p.minute}`};
const nyMin=epoch=>{const p=tzParts(epoch,'America/New_York');return(+p.hour%24)*60+(+p.minute)};

// Indicadores
const sma=(v,n)=>v.map((_,i)=>i<n-1?null:v.slice(i-n+1,i+1).reduce((a,b)=>a+b,0)/n);
const ema=(v,n)=>{const k=2/(n+1);let e=null;return v.map((x,i)=>{if(x==null)return null;e=e==null?x:x*k+e*(1-k);return i<n-1?null:e})};
function rsi(v,n=14){const out=v.map(()=>null);let g=0,l=0;for(let i=1;i<v.length;i++){const d=v[i]-v[i-1];const up=Math.max(d,0),dn=Math.max(-d,0);if(i<=n){g+=up;l+=dn;if(i===n){g/=n;l/=n;out[i]=l===0?100:100-100/(1+g/l)}}else{g=(g*(n-1)+up)/n;l=(l*(n-1)+dn)/n;out[i]=l===0?100:100-100/(1+g/l)}}return out}
function macd(v){const a=ema(v,12),b=ema(v,26);const m=v.map((_,i)=>a[i]!=null&&b[i]!=null?a[i]-b[i]:null);const start=m.findIndex(x=>x!=null);const sig=m.map(()=>null);if(start>=0){const s=ema(m.slice(start),9);s.forEach((x,i)=>sig[start+i]=x)}return{m,sig,h:m.map((x,i)=>x!=null&&sig[i]!=null?x-sig[i]:null)}}
function boll(v,n=20,k=2){const s=sma(v,n);return s.map((m,i)=>{if(m==null)return null;const w=v.slice(i-n+1,i+1);const sd=Math.sqrt(w.reduce((a,b)=>a+(b-m)**2,0)/n);return[m+k*sd,m-k*sd]})}
// Pivotes clásicos con el máximo, mínimo y cierre del día anterior (mismas fórmulas que la planilla)
function pivots(h,l,c){const pp=(h+l+c)/3,bc=(h+l)/2,tc=2*pp-bc;return{pp,r1:2*pp-l,s1:2*pp-h,r2:pp+(h-l),s2:pp-(h-l),r3:h+2*(pp-l),s3:l-2*(h-pp),bc,tc}}

// ---------- Datos ----------
let SUM=null,ORDER=[],M={};const cacheT={},cacheI={};let PLAN=null;
async function getJSON(p){const r=await fetch(p,{cache:'no-store'});if(!r.ok)throw new Error(p+': '+r.status);return r.json()}
let CUR='USD';try{if(localStorage.getItem('cur')==='CLP')CUR='CLP'}catch(e){}
// Valor del dólar en pesos para una fecha: último cierre disponible en o antes de ese día
function fxAt(s,d){if(!s||!s.length)return null;let lo=0,hi=s.length-1;if(d<s[0][0])return s[0][1];while(lo<hi){const m=(lo+hi+1)>>1;if(s[m][0]<=d)lo=m;else hi=m-1}return s[lo][1]}
const fxSum=()=>(SUM&&SUM.macro&&SUM.macro.USDCLP)||null;
const inCur=cl=>{const s=fxSum();return CUR==='CLP'&&s?cl.map(([d,c])=>[d,c*fxAt(s,d)]):cl};
const curSeg=id=>`<div class="seg" id="${id}" title="Moneda en que se miden precios y rentabilidades"><button data-c="USD" aria-pressed="${CUR==='USD'}">Dólares</button><button data-c="CLP" aria-pressed="${CUR==='CLP'}">Pesos</button></div>`;
const curCl=t=>t==='USDCLP'?SUM.tickers[t].closes:inCur(SUM.tickers[t].closes);
function computeMetrics(){M={};for(const t of ORDER.concat(SUM.tickers.USDCLP?['USDCLP']:[])){const raw=SUM.tickers[t].closes,cl=curCl(t),cu=raw.map(x=>x[1]),c=cl.map(x=>x[1]),n=c.length;const at=k=>n>k?c[n-1]/c[n-1-k]-1:null;const s20=sma(cu,20);const lb=SUM.tickers[t].lastBar;const fxl=CUR==='CLP'&&fxSum()?fxSum()[fxSum().length-1][1]:1;
  M[t]={last:c[n-1],lastDate:cl[n-1][0],d1:at(1),d5:at(5),d21:at(21),y1:at(Math.min(252,n-1)),vsS20:s20[n-1]?cu[n-1]/s20[n-1]-1:null,rsi:rsi(cu)[n-1],spark:c.slice(-10),lastBar:lb,price:lb?lb[4]*fxl:c[n-1]}}}

const led=document.getElementById('led'),smsg=document.getElementById('smsg');
function setStatus(kind,msg){led.className='led '+kind;smsg.textContent=msg}
function freshness(){const u=SUM&&SUM.updated;if(!u)return;const ago=(Date.now()-Date.parse(u))/60000;const when=new Date(u).toLocaleString('es-CL',{timeZone:'America/Santiago',day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});
  setStatus(ago<40?'ok':'busy',`Última descarga: ${when} (hora de Chile). ${ago<40?'La página se refresca sola cada 2 minutos.':'Fuera de horario de mercado, o la acción de GitHub no ha corrido recientemente.'}`)}

// ---------- Navegación y gráficos ----------
const nav=document.getElementById('nav');
const MENU=[['resumen','Resumen'],['analisis','Análisis técnico'],['momentum','Momentum'],['paper','Simulación'],['buzon','Buzón']];
function renderNav(cur){nav.innerHTML=MENU.map(([k,l])=>`<a href="#${k}" ${cur===k?'aria-current="page"':''}>${l}${k==='buzon'&&unreadCount()?` <span class="sig sig-buy" style="padding:0 5px">${unreadCount()}</span>`:''}</a>`).concat('<span class="brk"></span>',ORDER.map(t=>`<a href="#${t}" ${cur===t?'aria-current="page"':''}><span class="dot ${M[t].d1>=0?'up':'down'}"></span>${t}</a>`)).join('')}
let charts=[],obs=[];
function clearCharts(){obs.forEach(o=>o.disconnect());obs=[];charts.forEach(c=>{try{c.remove()}catch(e){}});charts=[]}
function baseOpts(el,extra={}){return Object.assign({width:el.clientWidth,height:el.clientHeight,layout:{background:{type:'solid',color:css('--panel')},textColor:css('--muted'),fontFamily:'IBM Plex Mono, monospace',fontSize:11},grid:{vertLines:{color:css('--grid')},horzLines:{color:css('--grid')}},rightPriceScale:{borderColor:css('--line'),minimumWidth:78},timeScale:{borderColor:css('--line')},crosshair:{mode:0},localization:{locale:'es-CL',priceFormatter:p=>fmt(p,2)}},extra)}
function mk(el,extra){const c=LightweightCharts.createChart(el,baseOpts(el,extra));charts.push(c);const o=new ResizeObserver(()=>{try{c.applyOptions({width:el.clientWidth})}catch(e){}});o.observe(el);obs.push(o);return c}
const PALETTE=['#1f5fbf','#d0661b','#0f8a5f','#9b3fb5','#c73a3a','#2a9bb0','#7a6a14','#d94c8a','#4b5fd6','#6b8e23','#b0702a','#3b8bdb','#a33d3d','#2e7d6b','#8250df','#c9821b','#5a6f8a','#e05a2a','#3f9d4a'];
function sparkSvg(v){if(v.length<2)return'';const w=110,h=26,mn=Math.min(...v),mx=Math.max(...v),r=mx-mn||1;const pts=v.map((x,i)=>`${(i/(v.length-1)*w).toFixed(1)},${(h-2-(x-mn)/r*(h-4)).toFixed(1)}`).join(' ');const col=v[v.length-1]>=v[0]?'var(--up)':'var(--down)';const ly=h-2-(v[v.length-1]-mn)/r*(h-4);return`<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true"><polyline points="${pts}" fill="none" stroke="${col}" stroke-width="1.4"/><circle cx="${w-1.5}" cy="${ly}" r="2.2" fill="${col}"/></svg>`}

  view.innerHTML=`
  <section class="panel"><div class="row"><h2>Desempeño de los activos</h2>${curSeg('cur')}</div><p class="sub">"Día" compara el último precio con el cierre anterior. ${CUR==='CLP'?'Precios y rentabilidades en pesos chilenos: incluyen la variación del dólar. RSI y SMA20 se calculan sobre el precio en dólares. ':''}Clic en una fila para abrir el activo.</p>

  <div class="grid2">
    <section class="panel"><div class="row"><div><h2>Rendimiento comparado</h2><p class="sub">Cartera del bot y referencias, base 100 al inicio del período</p></div>
      <div class="seg" id="prange">${[[21,'1M'],[63,'3M'],[126,'6M'],[260,'1A']].map(([n,l])=>`<button data-n="${n}" aria-pressed="${n===perfRange}">${l}</button>`).join('')}</div></div>
      <div class="chart" id="perf"></div><div class="legend" id="perfleg"></div></section>
    <section class="panel"><h2>Ranking del período</h2><p class="sub" id="ranksub"></p><div class="bars" id="rank"></div></section>

  const drawRows=()=>view.querySelectorAll('tbody[data-g]').forEach(tb=>{const rows=[...G[tb.dataset.g]].sort((a,b)=>{if(sortKey==='t')return sortDir*a.localeCompare(b);const x=M[a][sortKey],y=M[b][sortKey];return sortDir*((x??-1e9)-(y??-1e9))});
    tb.innerHTML=rows.map(t=>{const m=M[t];return`<tr data-t="${t}"><td><span class="tk">${t}</span><span class="rb">${esc(t==='USDCLP'?'Dólar en pesos chilenos':RUBRO[t]||'')}</span></td>
    <td class="num">${fmt(m.price)}<span class="rb">${m.lastBar?fdate(new Date(m.lastBar[0]*1000).toISOString().slice(0,10))+' '+clTime(m.lastBar[0]):fdate(m.lastDate)}</span></td>
    <td class="num ${cls(m.d1)}">${pct(m.d1)}</td><td class="num ${cls(m.d5)}">${pct(m.d5)}</td><td class="num ${cls(m.d21)}">${pct(m.d21)}</td><td class="num ${cls(m.y1)}">${pct(m.y1)}</td>
    <td class="num ${cls(m.vsS20)}">${pct(m.vsS20)}</td>
    <td class="num">${m.rsi==null?'–':`<span class="pill ${m.rsi>70?'down':m.rsi<30?'up':'muted'}">${fmt(m.rsi,0)}</span>`}</td>

  const hidden=new Set();

    const PL=BOT.concat(REF).length?BOT.concat(REF):ORDER;
    PL.forEach((t,i)=>{const d=curCl(t).slice(-perfRange);const b=d[0][1];const s=ch.addLineSeries({color:PALETTE[i%PALETTE.length],lineWidth:t==='QQQ'?3:1.5,priceLineVisible:false,lastValueVisible:false,visible:!hidden.has(t)});

      ${T.sales.map(x => `<tr style="cursor:default"><td style="text-align:left"><span class="tk">${esc(x.t)}</span>${x.approx ? ' <span class="muted" title="Valor aproximado">*</span>' : ''}</td><td class="num">${fmt(x.qty, 4)}</td><td class="num">${fdate(x.buy)}</td><td class="num">${fdate(x.sell)}</td><td class="num">${fmt(x.buy_px)}</td><td class="num">${fmt(x.sell_px)}</td><td class="num">${fmt(x.fx_buy)}</td><td class="num">${fmt(x.fx_sell)}</td><td class="num">${pct(x.ipc - 1)}</td><td class="num">${clp(x.cost)}</td><td class="num">${clp(x.proceeds)}</td><td class="num ${cls(x.gain)}">${clp(x.gain)}</td></tr>`).join('')}
    </tbody></table></div>` : '<p class="muted">Sin ventas este año.</p>'}
    ${(PTAX.held || []).length ? `<h3 style="margin:14px 0 6px">Compras aún en cartera</h3><p class="sub" style="margin:0 0 4px">Con el dólar observado del día de cada compra, que será su costo al venderlas.</p><div class="tablebox"><table><thead><tr><th style="text-align:left">Acción</th><th>Cantidad</th><th>Compra</th><th>Precio (US$)</th><th>Dólar observado</th><th>Costo ($)</th></tr></thead><tbody>
      ${PTAX.held.map(x => `<tr style="cursor:default"><td style="text-align:left"><span class="tk">${esc(x.t)}</span>${x.official ? '' : ' <span class="muted" title="Dólar de Yahoo, aproximado">*</span>'}</td><td class="num">${fmt(x.qty, 4)}</td><td class="num">${fdate(x.buy)}</td><td class="num">${fmt(x.buy_px)}</td><td class="num">${fmt(x.fx_buy)}</td><td class="num">${clp(x.qty * x.buy_px * x.fx_buy)}</td></tr>`).join('')}
    </tbody></table></div>` : ''}</section>`;
}
function bindTax(view) {
  const y = view.querySelector('#taxy'), o = view.querySelector('#taxo');
  const redo = () => { const yy = view.querySelector('#taxy'); if (!yy) return; const sec = yy.closest('section'), tmp = document.createElement('div'); tmp.innerHTML = taxSection(); sec.replaceWith(tmp.firstElementChild); bindTax(view) };
  if (y) y.onclick = e => { const b = e.target.closest('button'); if (!b) return; taxYear = b.dataset.v; redo() };
  if (o) o.onchange = () => { try { localStorage.setItem('otrosIngresos', String(Math.max(0, +o.value || 0))) } catch (e) { } o.onchange = null; setTimeout(redo) };
}
// Buzón: el estado de leído se guarda solo en este navegador
let bzFilter = 'all';
function seenKeys() { try { return new Set(JSON.parse(localStorage.getItem('buzonSeen') || '[]')) } catch (e) { return new Set() } }
function saveSeen(s) { try { localStorage.setItem('buzonSeen', JSON.stringify([...s].slice(-3000))) } catch (e) { } }
function unreadCount() { const s = seenKeys(); return LOG.filter(a => !s.has(a.key)).length }
const SRC = { momentum: 'Momentum top 10' };
function renderBuzon(view) {
  const seen = seenKeys();
  const L = LOG.filter(a => bzFilter === 'all' || (bzFilter === 'buy' || bzFilter === 'sell' ? a.a === bzFilter : a.src === bzFilter)).slice().sort((a, b) => b.d.localeCompare(a.d) || a.t.localeCompare(b.t));
  const days = [...new Set(L.map(a => a.d))];
  const nU = LOG.filter(a => !seen.has(a.key)).length;
  view.innerHTML = `<section class="panel"><div class="row"><div><h2>Buzón de alertas</h2><p class="sub">Las compras y ventas de la estrategia que replica la <a href="#paper">Simulación</a> en Alpaca paper (las 10 acciones más fuertes con filtro de mercado), de la más nueva a la más antigua. Se registran al cierre, también llegan por correo y la cuenta las ejecuta en la apertura siguiente. ${nU ? `<b>${nU} sin leer.</b>` : 'Todo leído.'}</p></div>
    <span style="display:flex;gap:6px;flex-wrap:wrap">${'Notification' in window ? `<button class="btn" id="bzn">${Notification.permission === 'granted' ? 'Avisos del navegador activados' : 'Avisarme en este navegador'}</button>` : ''}<button class="btn" id="bzr" ${nU ? '' : 'disabled'}>Marcar todo como leído</button></span></div>
    <div class="lab-top"><span class="seg" id="bzf" style="flex-wrap:wrap">${[['all', 'Todas'], ['buy', 'Compras'], ['sell', 'Ventas']].map(([k, l]) => `<button data-v="${k}" aria-pressed="${k === bzFilter}">${l}</button>`).join('')}</span></div>
    ${days.length ? days.map(d => `<h3 style="margin:14px 0 6px">${fdate(d)}</h3><div class="alerts">${L.filter(a => a.d === d).map(a => `<a class="alert ${a.a === 'buy' ? 'a-buy' : 'a-sell'}" data-key="${esc(a.key)}" href="${a.src === 'momentum' ? '#momentum' : tkLink(a.t)}" style="min-width:180px${seen.has(a.key) ? ';opacity:.75' : ''}"><span style="font-size:1.15rem"><b>${esc(a.t)}</b> ${actPill(a.a)}${seen.has(a.key) ? '' : ' <span class="sig sig-long" style="padding:0 5px">Nueva</span>'}</span><span class="rb">${esc(SRC[a.src] || a.src)} · ${esc(a.txt)}</span></a>`).join('')}</div>`).join('') : '<p class="muted">No hay alertas con este filtro.</p>'}
    </section>`;
  view.querySelector('#bzf').onclick = e => { const b = e.target.closest('button'); if (!b) return; bzFilter = b.dataset.v; renderBuzon(view) };
  view.querySelector('#bzr').onclick = () => { LOG.forEach(a => seen.add(a.key)); saveSeen(seen); renderNav(curRoute); renderBuzon(view) };
  const bn = view.querySelector('#bzn'); if (bn) bn.onclick = () => Notification.requestPermission().then(() => renderBuzon(view));
  view.querySelectorAll('a[data-key]').forEach(el => el.addEventListener('click', () => { seen.add(el.dataset.key); saveSeen(seen) }));
  rerender = () => renderBuzon(view);
}
async function loadLog() {
  const prev = new Set(LOG.map(a => a.key)), first = !LOG.length;
  try { LOG = (await getJSON('data/alerts_log.json')).filter(a => a.src === 'momentum') } catch (e) { return }
  try { if (!first && 'Notification' in window && Notification.permission === 'granted') for (const a of LOG) if (!prev.has(a.key)) new Notification(`${a.t}: ${a.a === 'buy' ? 'COMPRA' : 'VENTA'}`, { body: `${SRC[a.src] || a.src}. ${a.txt}` }) } catch (e) { }
}

let rerender=()=>{},curRoute=null;
function route(){const h=location.hash.replace('#','').split('?')[0];const t=ORDER.includes(h)||MENU.some(m=>m[0]===h)?h:'resumen';curRoute=t;renderNav(t);clearCharts();const v=document.getElementById('view');
  document.getElementById('asof').textContent='al '+fdate(ORDER.map(x=>M[x].lastDate).sort().pop());
  if(t==='resumen')renderSummary(v);else if(t==='analisis')renderTA(v);else if(t==='momentum')renderMomentum(v);else if(t==='paper')renderPaper(v);else if(t==='buzon')renderBuzon(v);else renderAsset(v,t)}
window.addEventListener('hashchange',()=>{route();window.scrollTo(0,0)});
const rerun=()=>{try{rerender()}catch(e){}};
try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',rerun)}catch(e){}
new MutationObserver(rerun).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
// Lista fija de activos más las acciones de la cartera del bot (summary.bot); el dólar se agrega como fila del resumen
function setOrder(){const has=t=>SUM.tickers[t]&&SUM.tickers[t].closes&&SUM.tickers[t].closes.length>1;
  ORDER=ALL.concat((SUM.bot||[]).filter(t=>!ALL.includes(t))).filter(has);
  if(SUM.macro&&SUM.macro.USDCLP&&SUM.macro.USDCLP.length>1)SUM.tickers.USDCLP={closes:SUM.macro.USDCLP,lastBar:null}}
async function load(){
  try{SUM=await getJSON('data/summary.json')}catch(e){setStatus('bad','Aún no hay datos. En GitHub, abre la pestaña Actions y ejecuta "Actualizar datos".');document.getElementById('view').innerHTML='<p class="empty">Sin datos todavía.</p>';return false}
  setOrder();computeMetrics();freshness();SIG=await getJSON('data/signals.json').catch(()=>null);await loadLog();return true}
async function refresh(){const before=SUM&&SUM.updated;try{const s=await getJSON('data/summary.json');if(s.updated!==before){SIG=await getJSON('data/signals.json').catch(()=>SIG);await loadLog();MOM=null;for(const k in cacheS)delete cacheS[k];SUM=s;setOrder();for(const k in cacheT)delete cacheT[k];for(const k in cacheI)delete cacheI[k];computeMetrics();const y=window.scrollY;route();window.scrollTo(0,y)}freshness()}catch(e){}}
if(!window.LightweightCharts){document.getElementById('view').innerHTML='<p class="empty">No se pudo cargar la librería de gráficos. Recarga la página.</p>';return}
getJSON('data/planilla.json').then(p=>{PLAN=p}).catch(()=>{}).finally(async()=>{if(await load())route();setInterval(refresh,120000)});
})();
</script>
