<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mesa Finanzas Bot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
html{color-scheme:light}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}
/* Layout: barra de activos arriba, vista resumen (tabla + curvas base 100) o ficha por activo con pestañas Intradía / Diario / Semanal */
:root{
  --bg:#f3f5f8; --panel:#ffffff; --ink:#132033; --muted:#5b6b82; --line:#dbe1ea; --grid:#e9edf3;
  --accent:#1f5fbf; --accent-soft:#e3ecfa; --up:#0f8a5f; --down:#c73a3a; --warn:#b26a00; --band:rgba(31,95,191,.08);
  --f-display:"Archivo","Helvetica Neue",Arial,sans-serif; --f-body:"IBM Plex Sans","Segoe UI",Roboto,sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d131c; --panel:#141c27; --ink:#e4eaf3; --muted:#8d9bb0; --line:#243042; --grid:#1c2633;
  --accent:#6aa3ff; --accent-soft:#1a2b45; --up:#3fcf95; --down:#ff7272; --warn:#f0b24a; --band:rgba(106,163,255,.10); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d131c; --panel:#141c27; --ink:#e4eaf3; --muted:#8d9bb0; --line:#243042; --grid:#1c2633;
  --accent:#6aa3ff; --accent-soft:#1a2b45; --up:#3fcf95; --down:#ff7272; --warn:#f0b24a; --band:rgba(106,163,255,.10); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45}
.wrap{max-width:1240px;margin:0 auto;padding-inline:16px;padding-block:16px 40px;display:flex;flex-direction:column;gap:18px}
header.top{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px 16px}
h1{font-family:var(--f-display);font-weight:800;font-size:1.55rem;letter-spacing:-.01em;margin:0;text-wrap:balance}
h1 small{font-weight:500;color:var(--muted);font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;margin-left:8px}
.src{color:var(--muted);font-size:.8rem}
nav.tickers{display:flex;flex-wrap:wrap;gap:6px}
nav.tickers a{font-family:var(--f-mono);font-size:.8rem;text-decoration:none;color:var(--ink);border:1px solid var(--line);background:var(--panel);padding:4px 9px;border-radius:4px;display:inline-flex;gap:6px;align-items:center}
nav.tickers a:hover{border-color:var(--accent)}
nav.tickers a[aria-current="page"]{background:var(--accent);border-color:var(--accent);color:var(--panel)}
nav.tickers a .dot{width:6px;height:6px;border-radius:50%;background:var(--muted)}
nav.tickers a .dot.up{background:var(--up)} nav.tickers a .dot.down{background:var(--down)}
nav.tickers a[aria-current="page"] .dot{background:var(--panel)}
a:focus-visible,button:focus-visible,select:focus-visible,th:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px;min-width:0}
.panel h2{font-family:var(--f-display);font-weight:700;font-size:1.05rem;margin:0 0 4px}
.panel .sub{color:var(--muted);font-size:.8rem;margin:0 0 12px}
.grid2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:18px}
@media (max-width:900px){.grid2{grid-template-columns:minmax(0,1fr)}}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.up{color:var(--up)} .down{color:var(--down)} .muted{color:var(--muted)}
.tablebox{overflow-x:auto}.btin{display:none}@media (max-width:700px){.btcol{display:none}.btin{display:block;margin-top:6px;text-align:left}.btin .num{font-weight:600}}
table{border-collapse:collapse;width:100%;font-size:.85rem}
th,td{padding:7px 8px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font-weight:600;color:var(--muted);font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;cursor:pointer;user-select:none;position:sticky;top:0;background:var(--panel)}
th[aria-sort="ascending"]::after{content:" ▲"} th[aria-sort="descending"]::after{content:" ▼"}
tbody tr{cursor:pointer} tbody tr:hover{background:var(--accent-soft)}
td .tk{font-family:var(--f-mono);font-weight:500}
td .rb{display:block;color:var(--muted);font-size:.72rem}
.pill{display:inline-block;font-size:.7rem;padding:1px 7px;border-radius:999px;border:1px solid currentColor;font-family:var(--f-body)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:5px;overflow:hidden}
.seg button{font:inherit;font-size:.8rem;background:var(--panel);color:var(--ink);border:0;padding:5px 11px;cursor:pointer;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--panel)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.chart{width:100%;height:340px;position:relative}
.chart.sm{height:120px}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:.75rem;color:var(--muted);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:5px;cursor:pointer}
.legend i{width:12px;height:3px;border-radius:2px;display:inline-block}
.legend span.off{opacity:.35}
.bars{display:flex;flex-direction:column;gap:4px}
.bar{display:grid;grid-template-columns:52px 1fr 64px;align-items:center;gap:8px;font-size:.8rem}
.bar .track{position:relative;height:14px}
.bar .track .mid{position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:var(--line)}
.bar .track .fill{position:absolute;top:2px;height:10px;border-radius:2px}
.hero{display:flex;flex-wrap:wrap;gap:12px 28px;align-items:flex-end}
.hero .big{font-family:var(--f-display);font-size:2.2rem;font-weight:800;line-height:1}
.stat{display:flex;flex-direction:column;gap:2px}
.stat b{font-size:.68rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.levels{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.levels div{border:1px solid var(--line);border-radius:4px;padding:6px 8px;display:flex;justify-content:space-between;gap:6px;font-size:.8rem}
.note{font-size:.78rem;color:var(--muted);margin:8px 0 0}
.flag{color:var(--warn)}
select{font:inherit;font-size:.8rem;padding:4px 6px;border:1px solid var(--line);border-radius:4px;background:var(--panel);color:var(--ink)}
.toggles{display:flex;flex-wrap:wrap;gap:10px;font-size:.8rem;color:var(--muted)}
.toggles label{display:inline-flex;gap:4px;align-items:center;cursor:pointer}
.empty{color:var(--muted);padding:40px 0;text-align:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.sig{display:inline-block;font-size:.72rem;font-weight:600;padding:2px 8px;border-radius:4px;letter-spacing:.02em}
.sig-buy{background:var(--up);color:var(--panel)} .sig-sell{background:var(--down);color:var(--panel)}
.sig-long{border:1px solid var(--up);color:var(--up)} .sig-flat{border:1px solid var(--line);color:var(--muted)}
.alerts{display:flex;flex-wrap:wrap;gap:8px}
.alert{display:flex;flex-direction:column;gap:2px;text-decoration:none;color:var(--ink);border-radius:6px;padding:8px 12px;border:1px solid var(--line);flex:1 1 240px;min-width:0}
.alert.a-buy{border-color:var(--up);box-shadow:inset 3px 0 0 var(--up)} .alert.a-sell{border-color:var(--down);box-shadow:inset 3px 0 0 var(--down)}
.alert .rb,.sigbox .rb{display:block;color:var(--muted);font-size:.75rem}
.sigbox{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:baseline}
.btn{font:inherit;font-size:.8rem;border:1px solid var(--accent);color:var(--accent);background:var(--panel);border-radius:5px;padding:5px 11px;cursor:pointer}
.btn:hover{background:var(--accent-soft)}
.status{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;font-size:.8rem;color:var(--muted);border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:8px 12px}
.status .led{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.status .led.ok{background:var(--up)} .status .led.bad{background:var(--down)} .status .led.busy{background:var(--warn)}
.status .msg{flex:1 1 260px;min-width:0}
/* Laboratorio */
.lab-top{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;font-size:.8rem;color:var(--muted);margin:12px 0}
.lab-top label{display:inline-flex;gap:6px;align-items:center}
.lab-h{font-size:.8rem;font-weight:600;margin:14px 0 6px}
.lnk{font:inherit;font-size:.75rem;font-weight:400;background:none;border:0;color:var(--accent);cursor:pointer;padding:0 4px;text-decoration:underline}
.lab-assets{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;gap:5px;align-items:center;font-family:var(--f-mono);font-size:.78rem;border:1px solid var(--line);border-radius:5px;padding:4px 8px;cursor:pointer;background:var(--panel)}
.chip:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.grid-rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:14px;margin-top:14px}
.lab-rule{border:1px solid var(--line);border-radius:6px;padding:10px 12px}
.lab-rule h3{font-size:.9rem;margin:0}
.lab-rule .sub{margin:6px 0 8px}
.lab-cond{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:7px 0;border-top:1px solid var(--line);font-size:.8rem}
.lab-expr{display:inline-flex;flex-wrap:wrap;gap:5px;align-items:center;flex:1 1 220px}
.lab-n{font:inherit;font-family:var(--f-mono);font-size:.8rem;width:4.6em;padding:3px 5px;border:1px solid var(--line);border-radius:4px;background:var(--panel);color:var(--ink)}
.lab-x{font:inherit;background:none;border:1px solid var(--line);border-radius:4px;color:var(--muted);cursor:pointer;width:26px;height:26px;margin-left:auto}
.lab-x:hover{color:var(--down);border-color:var(--down)}
.lab-rule .btn{margin-top:8px}
.lab-info{flex:1 1 100%;font-size:.78rem}
.lab-info summary{cursor:pointer;color:var(--accent);list-style:none;display:inline}
.lab-info summary::before{content:"ⓘ ";}
.lab-info[open] summary{font-weight:600}
.lab-dl{margin:6px 0 2px;display:grid;grid-template-columns:max-content 1fr;gap:4px 10px;color:var(--ink);background:var(--accent-soft);border-radius:5px;padding:8px 10px}
.lab-dl dt{font-weight:600;color:var(--muted)} .lab-dl dd{margin:0}
@media (max-width:700px){.lab-dl{grid-template-columns:1fr}.lab-dl dd{margin-bottom:4px}}
.lab-guide{margin-top:6px;font-size:.85rem}
.lab-guide>summary{cursor:pointer;font-weight:600;color:var(--accent)}
.lab-guide .lab-info{display:block;padding:5px 0;border-top:1px solid var(--line)}
.lab-guide .lab-info summary{color:var(--ink)}
.lab-cond>select[data-f=k]{max-width:230px}
@media (max-width:700px){.lab-cond>select{flex:1 1 100%;max-width:none!important}.lab-rule .seg button{padding:5px 8px}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>Mesa Finanzas Bot <small id="asof"></small></h1>
    <span class="src">Precios de Yahoo Finance, actualizados por GitHub cada 5 minutos en horario de mercado. Horas en hora de Chile.</span>
  </header>
  <div class="status" role="status"><span class="led busy" id="led"></span><span class="msg" id="smsg">Cargando datos…</span></div>
  <nav class="tickers" id="nav" aria-label="Activos"></nav>
  <main id="view"><p class="empty">Cargando datos…</p></main>
</div>

<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<script>
(function(){
const RUBRO={NVDA:'Tecnología electrónica',AMD:'Tecnología electrónica',WDC:'Tecnología electrónica',MU:'Tecnología electrónica',SNDK:'Tecnología electrónica',ASTS:'Comunicaciones',LUNR:'Aeroespacial y defensa',HYMC:'Metales preciosos',MP:'Imanes',DELL:'Hardware',INTC:'Semiconductores',AEHR:'Semiconductores',AXTI:'Semiconductores',NTAP:'Almacenamiento',SPCX:'Aeroespacial',QQQ:'ETF Nasdaq 100',STX:'Almacenamiento',FLEX:'Manufactura electrónica',DDOG:'Software',ACWI:'ETF acciones mundiales (MSCI ACWI)',SP500:'Índice S&P 500',NASDAQ:'Índice Nasdaq Compuesto'};
const ALL=['QQQ','NVDA','AMD','INTC','MU','SNDK','WDC','STX','NTAP','DELL','FLEX','AEHR','AXTI','DDOG','ASTS','LUNR','SPCX','HYMC','MP','ACWI','SP500','NASDAQ'];
// Momentos de la sesión que seguía la planilla, medidos desde la apertura de Nueva York (9:30)
const SLOTS=[['Apertura',0],['+5 min',5],['+15 min',15],['+30 min',30],['+45 min',45],['+60 min',60]];
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const fmt=(x,d=2)=>x==null||!isFinite(x)?'–':x.toLocaleString('es-CL',{minimumFractionDigits:d,maximumFractionDigits:d});
const fmtInt=x=>x==null||!isFinite(x)?'–':Math.round(x).toLocaleString('es-CL');
const pct=x=>x==null||!isFinite(x)?'–':(x>0?'+':'')+fmt(x*100,2)+'%';
const cls=x=>x==null||!isFinite(x)?'muted':x>=0?'up':'down';
const MES=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const fdate=s=>{if(!s)return'–';const [y,m,d]=s.split('-');return `${d}-${MES[+m-1]}-${y.slice(2)}`};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const tzParts=(epoch,tz)=>{const o={};new Intl.DateTimeFormat('en-US',{timeZone:tz,hourCycle:'h23',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit'}).formatToParts(new Date(epoch*1000)).forEach(p=>o[p.type]=p.value);return o};
const tzOffset=(epoch,tz)=>{const p=tzParts(epoch,tz);return(Date.UTC(+p.year,+p.month-1,+p.day,+p.hour%24,+p.minute,+p.second)/1000)-epoch};
const clTime=epoch=>{const p=tzParts(epoch,'America/Santiago');return`${p.hour}:${p.minute}`};
const nyMin=epoch=>{const p=tzParts(epoch,'America/New_York');return(+p.hour%24)*60+(+p.minute)};

// Indicadores
const sma=(v,n)=>v.map((_,i)=>i<n-1?null:v.slice(i-n+1,i+1).reduce((a,b)=>a+b,0)/n);
const ema=(v,n)=>{const k=2/(n+1);let e=null;return v.map((x,i)=>{if(x==null)return null;e=e==null?x:x*k+e*(1-k);return i<n-1?null:e})};
function rsi(v,n=14){const out=v.map(()=>null);let g=0,l=0;for(let i=1;i<v.length;i++){const d=v[i]-v[i-1];const up=Math.max(d,0),dn=Math.max(-d,0);if(i<=n){g+=up;l+=dn;if(i===n){g/=n;l/=n;out[i]=l===0?100:100-100/(1+g/l)}}else{g=(g*(n-1)+up)/n;l=(l*(n-1)+dn)/n;out[i]=l===0?100:100-100/(1+g/l)}}return out}
function macd(v){const a=ema(v,12),b=ema(v,26);const m=v.map((_,i)=>a[i]!=null&&b[i]!=null?a[i]-b[i]:null);const start=m.findIndex(x=>x!=null);const sig=m.map(()=>null);if(start>=0){const s=ema(m.slice(start),9);s.forEach((x,i)=>sig[start+i]=x)}return{m,sig,h:m.map((x,i)=>x!=null&&sig[i]!=null?x-sig[i]:null)}}
function boll(v,n=20,k=2){const s=sma(v,n);return s.map((m,i)=>{if(m==null)return null;const w=v.slice(i-n+1,i+1);const sd=Math.sqrt(w.reduce((a,b)=>a+(b-m)**2,0)/n);return[m+k*sd,m-k*sd]})}
// Pivotes clásicos con el máximo, mínimo y cierre del día anterior (mismas fórmulas que la planilla)
function pivots(h,l,c){const pp=(h+l+c)/3,bc=(h+l)/2,tc=2*pp-bc;return{pp,r1:2*pp-l,s1:2*pp-h,r2:pp+(h-l),s2:pp-(h-l),r3:h+2*(pp-l),s3:l-2*(h-pp),bc,tc}}

// ---------- Datos ----------
let SUM=null,ORDER=[],M={};const cacheT={},cacheI={};let PLAN=null;
async function getJSON(p){const r=await fetch(p,{cache:'no-store'});if(!r.ok)throw new Error(p+': '+r.status);return r.json()}
let CUR='USD';try{if(localStorage.getItem('cur')==='CLP')CUR='CLP'}catch(e){}
// Valor del dólar en pesos para una fecha: último cierre disponible en o antes de ese día
function fxAt(s,d){if(!s||!s.length)return null;let lo=0,hi=s.length-1;if(d<s[0][0])return s[0][1];while(lo<hi){const m=(lo+hi+1)>>1;if(s[m][0]<=d)lo=m;else hi=m-1}return s[lo][1]}
const fxSum=()=>(SUM&&SUM.macro&&SUM.macro.USDCLP)||null;
const inCur=cl=>{const s=fxSum();return CUR==='CLP'&&s?cl.map(([d,c])=>[d,c*fxAt(s,d)]):cl};
const curSeg=id=>`<div class="seg" id="${id}" title="Moneda en que se miden precios y rentabilidades"><button data-c="USD" aria-pressed="${CUR==='USD'}">Dólares</button><button data-c="CLP" aria-pressed="${CUR==='CLP'}">Pesos</button></div>`;
function computeMetrics(){M={};for(const t of ORDER){const raw=SUM.tickers[t].closes,cl=inCur(raw),cu=raw.map(x=>x[1]),c=cl.map(x=>x[1]),n=c.length;const at=k=>n>k?c[n-1]/c[n-1-k]-1:null;const s20=sma(cu,20);const lb=SUM.tickers[t].lastBar;const fxl=CUR==='CLP'&&fxSum()?fxSum()[fxSum().length-1][1]:1;
  M[t]={last:c[n-1],lastDate:cl[n-1][0],d1:at(1),d5:at(5),d21:at(21),y1:at(Math.min(252,n-1)),vsS20:s20[n-1]?cu[n-1]/s20[n-1]-1:null,rsi:rsi(cu)[n-1],spark:c.slice(-60),lastBar:lb,price:lb?lb[4]*fxl:c[n-1]}}}

const led=document.getElementById('led'),smsg=document.getElementById('smsg');
function setStatus(kind,msg){led.className='led '+kind;smsg.textContent=msg}
function freshness(){const u=SUM&&SUM.updated;if(!u)return;const ago=(Date.now()-Date.parse(u))/60000;const when=new Date(u).toLocaleString('es-CL',{timeZone:'America/Santiago',day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});
  setStatus(ago<40?'ok':'busy',`Última descarga: ${when} (hora de Chile). ${ago<40?'La página se refresca sola cada 2 minutos.':'Fuera de horario de mercado, o la acción de GitHub no ha corrido recientemente.'}`)}

// ---------- Navegación y gráficos ----------
const nav=document.getElementById('nav');
function renderNav(cur){nav.innerHTML=[`<a href="#resumen" ${cur==='resumen'?'aria-current="page"':''}>Resumen</a>`,`<a href="#senales" ${cur==='senales'?'aria-current="page"':''}>Señales${newAlerts().length?` <span class="sig sig-buy" style="padding:0 5px">${newAlerts().length}</span>`:''}</a>`,`<a href="#lab" ${cur==='lab'?'aria-current="page"':''}>Laboratorio</a>`,`<a href="#ranking" ${cur==='ranking'?'aria-current="page"':''}>Ranking</a>`].concat(ORDER.map(t=>`<a href="#${t}" ${cur===t?'aria-current="page"':''}><span class="dot ${M[t].d1>=0?'up':'down'}"></span>${t}</a>`)).join('')}
let charts=[],obs=[];
function clearCharts(){obs.forEach(o=>o.disconnect());obs=[];charts.forEach(c=>{try{c.remove()}catch(e){}});charts=[]}
function baseOpts(el,extra={}){return Object.assign({width:el.clientWidth,height:el.clientHeight,layout:{background:{type:'solid',color:css('--panel')},textColor:css('--muted'),fontFamily:'IBM Plex Mono, monospace',fontSize:11},grid:{vertLines:{color:css('--grid')},horzLines:{color:css('--grid')}},rightPriceScale:{borderColor:css('--line'),minimumWidth:78},timeScale:{borderColor:css('--line')},crosshair:{mode:0},localization:{locale:'es-CL',priceFormatter:p=>fmt(p,2)}},extra)}
function mk(el,extra){const c=LightweightCharts.createChart(el,baseOpts(el,extra));charts.push(c);const o=new ResizeObserver(()=>{try{c.applyOptions({width:el.clientWidth})}catch(e){}});o.observe(el);obs.push(o);return c}
const PALETTE=['#1f5fbf','#d0661b','#0f8a5f','#9b3fb5','#c73a3a','#2a9bb0','#7a6a14','#d94c8a','#4b5fd6','#6b8e23','#b0702a','#3b8bdb','#a33d3d','#2e7d6b','#8250df','#c9821b','#5a6f8a','#e05a2a','#3f9d4a'];

// ---------- Laboratorio: reglas propias y backtesting ----------
// Usa sma, ema, rsi, macd y los formatos definidos en index.html.

const LAB_MA = (t, v, n) => t === 'SMA' ? sma(v, n) : ema(v, n);
const labMid = (h, l, n) => h.map((_, i) => i < n - 1 ? null : (Math.max(...h.slice(i - n + 1, i + 1)) + Math.min(...l.slice(i - n + 1, i + 1))) / 2);
const labShift = (v, k) => v.map((_, i) => i - k >= 0 ? v[i - k] : null);
const labCmp = (a, b, f) => a.map((x, i) => { const y = typeof b === 'number' ? b : b[i]; return x == null || y == null ? null : f(x, y) });
const labAnd = (...arrs) => arrs[0].map((_, i) => arrs.some(a => a[i] == null) ? null : arrs.every(a => a[i]));
const labOr = (...arrs) => arrs[0].map((_, i) => arrs.some(a => a[i] == null) ? null : arrs.some(a => a[i]));
const gt = (x, y) => x > y, lt = (x, y) => x < y;

function labStd(v, n) { const m = sma(v, n); return m.map((mu, i) => mu == null ? null : Math.sqrt(v.slice(i - n + 1, i + 1).reduce((a, b) => a + (b - mu) ** 2, 0) / n)) }
function labRsi(c, n) { return rsi(c, n) }
function labMacd(c, f, s, g) {
  const a = ema(c, f), b = ema(c, s); const m = c.map((_, i) => a[i] != null && b[i] != null ? a[i] - b[i] : null);
  const st = m.findIndex(x => x != null); const sg = st < 0 ? m.map(() => null) : m.map(() => null);
  if (st >= 0) { const e = ema(m.slice(st), g); e.forEach((x, j) => sg[st + j] = x) }
  return { m, sg };
}

// Media de Wilder (la que usan RSI, ATR y ADX): parte con el promedio simple de los primeros n valores
function labRma(v, n) { const out = v.map(() => null); let st = v.findIndex(x => x != null); if (st < 0 || st + n > v.length) return out; let a = v.slice(st, st + n).reduce((x, y) => x + y, 0) / n; out[st + n - 1] = a; for (let i = st + n; i < v.length; i++) { a = (a * (n - 1) + v[i]) / n; out[i] = a } return out }
const labTr = S => S.c.map((_, i) => i === 0 ? null : Math.max(S.h[i] - S.l[i], Math.abs(S.h[i] - S.c[i - 1]), Math.abs(S.l[i] - S.c[i - 1])));
const labAtr = (S, n) => labRma(labTr(S), n);
function labAdx(S, n) {
  const pdm = S.c.map((_, i) => { if (!i) return null; const u = S.h[i] - S.h[i - 1], d = S.l[i - 1] - S.l[i]; return u > d && u > 0 ? u : 0 }), mdm = S.c.map((_, i) => { if (!i) return null; const u = S.h[i] - S.h[i - 1], d = S.l[i - 1] - S.l[i]; return d > u && d > 0 ? d : 0 });
  const tr = labRma(labTr(S), n), pp = labRma(pdm, n), mm = labRma(mdm, n);
  const pdi = tr.map((t, i) => t ? 100 * pp[i] / t : null), mdi = tr.map((t, i) => t ? 100 * mm[i] / t : null);
  const dx = pdi.map((x, i) => x == null || mdi[i] == null || x + mdi[i] === 0 ? (x == null ? null : 0) : 100 * Math.abs(x - mdi[i]) / (x + mdi[i]));
  return { adx: labRma(dx, n), pdi, mdi };
}
function labChop(S, n) { const tr = labTr(S); return S.c.map((_, i) => { if (i < n) return null; let s = 0, hi = -Infinity, lo = Infinity; for (let j = i - n + 1; j <= i; j++) { s += tr[j]; hi = Math.max(hi, S.h[j]); lo = Math.min(lo, S.l[j]) } return hi > lo ? 100 * Math.log10(s / (hi - lo)) / Math.log10(n) : null }) }

// Cada indicador: cómo se escribe (form), sus parámetros, las condiciones posibles (ops) y su cálculo.
// form: textos y claves de parámetros en el orden en que se leen; 'op' es el selector de condición.
const LAB_DEFS = {
  ma2: { name: 'Media vs media', form: ['ta', 'a', 'op', 'tb', 'b'], p: { ta: 'EMA', a: 9, tb: 'SMA', b: 30 },
    ops: [['up', 'sobre'], ['dn', 'bajo']],
    calc(S, p) { const A = LAB_MA(p.ta, S.c, p.a), B = LAB_MA(p.tb, S.c, p.b); return { up: labCmp(A, B, gt), dn: labCmp(A, B, lt), lines: [[`${p.ta} ${p.a}`, A], [`${p.tb} ${p.b}`, B]] } } },
  ma3: { name: 'Dos medias vs una tercera', form: ['ta', 'a', 'y', 'tb', 'b', 'op', 'tc', 'c'], p: { ta: 'EMA', a: 9, tb: 'EMA', b: 18, tc: 'SMA', c: 30 },
    ops: [['up', 'ambas sobre'], ['dn', 'ambas bajo']],
    calc(S, p) { const A = LAB_MA(p.ta, S.c, p.a), B = LAB_MA(p.tb, S.c, p.b), C = LAB_MA(p.tc, S.c, p.c);
      return { up: labAnd(labCmp(A, C, gt), labCmp(B, C, gt)), dn: labAnd(labCmp(A, C, lt), labCmp(B, C, lt)), lines: [[`${p.ta} ${p.a}`, A], [`${p.tb} ${p.b}`, B], [`${p.tc} ${p.c}`, C]] } } },
  pma: { name: 'Precio vs media', form: ['Precio', 'op', 'ta', 'a'], p: { ta: 'SMA', a: 50 },
    ops: [['up', 'sobre'], ['dn', 'bajo']],
    calc(S, p) { const A = LAB_MA(p.ta, S.c, p.a); return { up: labCmp(S.c, A, gt), dn: labCmp(S.c, A, lt), lines: [[`${p.ta} ${p.a}`, A]] } } },
  rsi: { name: 'RSI', form: ['RSI', 'n', 'op', 'x'], p: { n: 14, x: 30 },
    ops: [['up', 'sobre'], ['dn', 'bajo']],
    calc(S, p) { const R = labRsi(S.c, p.n); return { up: labCmp(R, +p.x, gt), dn: labCmp(R, +p.x, lt) } } },
  macd: { name: 'MACD', form: ['MACD', 'f', 's', 'g', 'op'], p: { f: 12, s: 26, g: 9 },
    ops: [['sup', 'sobre su señal'], ['sdn', 'bajo su señal'], ['zup', 'sobre cero'], ['zdn', 'bajo cero']],
    calc(S, p) { const { m, sg } = labMacd(S.c, p.f, p.s, p.g); return { sup: labCmp(m, sg, gt), sdn: labCmp(m, sg, lt), zup: labCmp(m, 0, gt), zdn: labCmp(m, 0, lt) } } },
  cloud: { name: 'Ichimoku: nube', form: ['Ichimoku', 't', 'k', 's', '· precio', 'op', 'la nube'], p: { t: 9, k: 26, s: 52 },
    ops: [['up', 'sobre'], ['dn', 'bajo'], ['in', 'dentro de']],
    calc(S, p) { const T = labMid(S.h, S.l, p.t), K = labMid(S.h, S.l, p.k), B = labMid(S.h, S.l, p.s);
      const A = T.map((x, i) => x == null || K[i] == null ? null : (x + K[i]) / 2); const sa = labShift(A, p.k), sb = labShift(B, p.k);
      const top = sa.map((x, i) => x == null || sb[i] == null ? null : Math.max(x, sb[i])), bot = sa.map((x, i) => x == null || sb[i] == null ? null : Math.min(x, sb[i]));
      return { up: labCmp(S.c, top, gt), dn: labCmp(S.c, bot, lt), in: labAnd(labCmp(S.c, top, (x, y) => x <= y), labCmp(S.c, bot, (x, y) => x >= y)), lines: [['Senkou A', sa], ['Senkou B', sb]] } } },
  tk: { name: 'Ichimoku: Tenkan vs Kijun', form: ['Tenkan', 't', 'op', 'Kijun', 'k'], p: { t: 9, k: 26 },
    ops: [['up', 'sobre'], ['dn', 'bajo']],
    calc(S, p) { const T = labMid(S.h, S.l, p.t), K = labMid(S.h, S.l, p.k); return { up: labCmp(T, K, gt), dn: labCmp(T, K, lt), lines: [[`Tenkan ${p.t}`, T], [`Kijun ${p.k}`, K]] } } },
  chikou: { name: 'Cierre vs hace N barras (Chikou)', form: ['Cierre', 'op', 'el de hace', 'n', 'barras'], p: { n: 26 },
    ops: [['up', 'sobre'], ['dn', 'bajo']],
    calc(S, p) { const P = labShift(S.c, p.n); return { up: labCmp(S.c, P, gt), dn: labCmp(S.c, P, lt) } } },
  boll: { name: 'Bandas de Bollinger', form: ['Bollinger', 'n', 'k', '· precio', 'op'], p: { n: 20, k: 2 },
    ops: [['lo', 'bajo la banda inferior'], ['hi', 'sobre la banda superior'], ['mup', 'sobre la media'], ['mdn', 'bajo la media']],
    calc(S, p) { const M = sma(S.c, p.n), D = labStd(S.c, p.n); const U = M.map((m, i) => m == null ? null : m + p.k * D[i]), L = M.map((m, i) => m == null ? null : m - p.k * D[i]);
      return { lo: labCmp(S.c, L, lt), hi: labCmp(S.c, U, gt), mup: labCmp(S.c, M, gt), mdn: labCmp(S.c, M, lt), lines: [['Banda sup.', U], [`Media ${p.n}`, M], ['Banda inf.', L]] } } },
  donch: { name: 'Ruptura de máximo o mínimo', form: ['Cierre', 'op', 'de las', 'n', 'barras previas'], p: { n: 20 },
    ops: [['hi', 'sobre el máximo'], ['lo', 'bajo el mínimo']],
    calc(S, p) { const n = p.n; const H = S.h.map((_, i) => i < n ? null : Math.max(...S.h.slice(i - n, i))), L = S.l.map((_, i) => i < n ? null : Math.min(...S.l.slice(i - n, i)));

function monthsBack(d, n) { const [y, m, dd] = d.split('-').map(Number); const t = new Date(Date.UTC(y, m - 1 - n, Math.min(dd, 28))); return t.toISOString().slice(0, 10) }

// Series de un activo en la temporalidad elegida
function labSeries(t, tf) {
  const rows = tf === 'w' ? (cacheT[t].weekly || []) : cacheT[t].daily;
  const S = { d: [], o: [], h: [], l: [], c: [], v: [] };
  for (const r of rows) { if (r[4] == null) continue; S.d.push(typeof r[0] === 'number' ? new Date(r[0] * 1000).toISOString().slice(0, 10) : r[0]); S.o.push(r[1]); S.h.push(r[2]); S.l.push(r[3]); S.c.push(r[4]); S.v.push(r[5] || 0) }
  return S;
}

function labSignals(S, rule, fallbackNot) {
  if (!rule.c.length) return fallbackNot ? fallbackNot.map(x => !x) : S.c.map(() => false);
  const arrs = rule.c.map(c => { const d = LAB_DEFS[c.k]; const r = d.calc(S, c.p)[c.op];
    if (c.m === 'x') return r.map((x, i) => x === true && i > 0 && r[i - 1] === false);
    const nb = /^c(\d+)$/.exec(c.m); if (nb) { const k = +nb[1]; return r.map((x, i) => { if (x == null) return null; for (let j = Math.max(0, i - k + 1); j <= i; j++) if (r[j] !== true) return false; return i >= k - 1 }) }
    return r });
  return (rule.all ? labAnd : labOr)(...arrs).map(x => x === true);
}
function labLines(S, cfg) {
  const seen = new Set(), out = [];
  for (const c of [...cfg.entry.c, ...cfg.exit.c]) { const r = LAB_DEFS[c.k].calc(S, c.p); for (const [n, v] of r.lines || []) if (!seen.has(n)) { seen.add(n); out.push([n, v]) } }
  return out;
}

// Señal al cierre de la barra i, ejecución en la apertura de i+1. Stops dentro de la barra.
// K: valor del dólar en pesos por barra (null = medir en dólares). Las señales y los stops usan el precio en dólares;
// al comprar se convierten pesos a dólares y al vender se vuelve a pesos.
function labBacktest(S, E, X, o, i0, K) {
  const n = S.c.length, cost = o.cost, k = i => K ? K[i] : 1; let pos = 0, cash = 1, sh = 0, pin = 0, kin = 1, din = null, peak = 0, inMkt = 0;
  const trades = [], eq = [], ev = [];
  const sell = (i, px, why) => { cash = sh * px * k(i) * (1 - cost); sh = 0; pos = 0; trades.push({ in: din, pin, out: S.d[i], pout: px, ret: px * k(i) / (pin * kin) * (1 - cost) ** 2 - 1, why }); ev.push({ d: S.d[i], t: 'sell', p: px }) };
  for (let i = i0; i < n; i++) {
    if (i > i0) {
      if (pos === 0 && E[i - 1]) { sh = cash * (1 - cost) / (S.o[i] * k(i)); cash = 0; pos = 1; pin = S.o[i]; kin = k(i); din = S.d[i]; peak = S.o[i]; ev.push({ d: S.d[i], t: 'buy', p: S.o[i] }) }
      else if (pos === 1 && X[i - 1]) sell(i, S.o[i], 'regla');
    }
    if (pos === 1) {
      const st = [o.stop ? pin * (1 - o.stop) : null, o.trail ? peak * (1 - o.trail) : null].filter(x => x != null);
      const sp = st.length ? Math.max(...st) : null, tp = o.tp ? pin * (1 + o.tp) : null;
      if (sp != null && S.l[i] <= sp) sell(i, Math.min(S.o[i], sp), 'stop');
      else if (tp != null && S.h[i] >= tp) sell(i, Math.max(S.o[i], tp), 'objetivo');
      else { peak = Math.max(peak, S.h[i]); inMkt++ }
    }
    eq.push(cash + sh * S.c[i] * k(i));
  }
  let pk = eq[0], mdd = 0; for (const e of eq) { pk = Math.max(pk, e); mdd = Math.min(mdd, e / pk - 1) }
  const w = trades.filter(t => t.ret > 0).map(t => t.ret), l = trades.filter(t => t.ret <= 0).map(t => t.ret);
  const open = pos === 1 ? { in: din, pin, ret: S.c[n - 1] * k(n - 1) / (pin * kin) * (1 - cost) - 1 } : null;
  const bhv = i => S.c[i] * k(i) / (S.o[i0] * k(i0));
  let bpk = 1, bdd = 0; for (let i = i0; i < n; i++) { bpk = Math.max(bpk, bhv(i)); bdd = Math.min(bdd, bhv(i) / bpk - 1) }
  return { ret: eq[eq.length - 1] - 1, bh: bhv(n - 1) - 1, trades: trades.length, win: trades.length ? w.length / trades.length : null,
    avg: trades.length ? trades.reduce((a, t) => a + t.ret, 0) / trades.length : null, pf: l.length && l.reduce((a, b) => a + b, 0) < 0 ? w.reduce((a, b) => a + b, 0) / -l.reduce((a, b) => a + b, 0) : null,
    dd: mdd, bhdd: bdd, expo: inMkt / Math.max(1, n - i0), open, from: S.d[i0], list: trades, eq, ev, i0 };
}

function labRunAsset(t, cfg) {
  const S = labSeries(t, cfg.tf); if (S.c.length < 30) return null;
  const E = labSignals(S, cfg.entry), X = labSignals(S, cfg.exit, labSignals(S, { all: cfg.entry.all, c: cfg.entry.c.map(c => ({ ...c, m: 'e' })) }));
  const o = { cost: (+cfg.cost || 0) / 100, stop: +cfg.stop > 0 ? cfg.stop / 100 : null, tp: +cfg.tp > 0 ? cfg.tp / 100 : null, trail: +cfg.trail > 0 ? cfg.trail / 100 : null };
  let K = null;
  if (cfg.cur === 'CLP' && cacheT.USDCLP) { const fx = (cfg.tf === 'w' ? cacheT.USDCLP.weekly : cacheT.USDCLP.daily).filter(r => r[4] != null).map(r => [r[0], r[4]]); if (fx.length) K = S.d.map(d => fxAt(fx, d)) }
  const res = {}; const last = S.d[S.d.length - 1];
  for (const [k, , m] of LAB_WINS[cfg.tf]) {
    const start = monthsBack(last, m); const i0 = S.d.findIndex(d => d >= start);
    if (i0 < 0 || (i0 === 0 && (Date.parse(S.d[0]) - Date.parse(start)) / 864e5 > 10)) continue;
    res[k] = labBacktest(S, E, X, o, i0, K);
  }
  return { S, E, X, K, res, state: { inE: E[E.length - 1], inX: X[X.length - 1] } };
}

function labCondRow(c, ci, side) {
  const d = LAB_DEFS[c.k];
  const parts = d.form.map(f => f === 'op' ? `<select data-side="${side}" data-ci="${ci}" data-f="op">${d.ops.map(([k, l]) => `<option value="${k}" ${k === c.op ? 'selected' : ''}>${l}</option>`).join('')}</select>`
    : f in d.p ? labParamInput(c, f, ci, side) : f === 'y' ? '<span>y</span>' : `<span>${esc(f)}</span>`).join('');
  return `<div class="lab-cond">
    <select data-side="${side}" data-ci="${ci}" data-f="k" title="Indicador">${Object.entries(LAB_DEFS).map(([k, x]) => `<option value="${k}" ${k === c.k ? 'selected' : ''}>${x.name}</option>`).join('')}</select>
    <span class="lab-expr">${parts}</span>
    <select data-side="${side}" data-ci="${ci}" data-f="m" title="Cuándo cuenta"><option value="e" ${c.m === 'e' ? 'selected' : ''}>mientras se cumpla</option><option value="x" ${c.m === 'x' ? 'selected' : ''}>solo el día que empieza</option>${[2, 3, 5].map(k => `<option value="c${k}" ${c.m === 'c' + k ? 'selected' : ''}>si lleva ${k} barras seguidas</option>`).join('')}</select>
    <button class="lab-x" data-side="${side}" data-del="${ci}" title="Quitar" aria-label="Quitar condición">×</button>
    <details class="lab-info"><summary>¿Qué es ${esc(d.name)}?</summary>${labInfoHtml(c.k)}</details></div>`;
}
function labRuleBox(side, title, help) {
  const r = LAB[side];
  return `<div class="lab-rule"><div class="row"><h3>${title}</h3><div class="seg" data-all="${side}"><button data-v="1" aria-pressed="${r.all}">Todas (Y)</button><button data-v="0" aria-pressed="${!r.all}">Cualquiera (O)</button></div></div>
    <p class="sub">${help}</p>${r.c.map((c, i) => labCondRow(c, i, side)).join('') || '<p class="muted" style="font-size:.8rem;margin:4px 0">Sin condiciones.</p>'}
    <button class="btn" data-add="${side}">+ Agregar condición</button></div>`;
}

function renderLab(view) {
  if (/^#lab\?c=/.test(location.hash)) { LAB = null; const c = labLoadCfg(); history.replaceState(null, '', '#lab'); if (c) { LAB = c; labSave() } }
  if (!LAB) { LAB = labLoadCfg() || labDefault() }
  for (const s of ['entry', 'exit']) LAB[s].c = LAB[s].c.map(labCond);
  if (!LAB.cur) LAB.cur = 'USD';
  LAB.assets = LAB.assets.filter(t => ORDER.includes(t)); if (!LAB.assets.length) LAB.assets = [ORDER[0]];
  if (!LAB_WINS[LAB.tf].some(w => w[0] === LAB.win)) LAB.win = LAB_WINS[LAB.tf][LAB.tf === 'd' ? 2 : 1][0];
  view.innerHTML = `
  <section class="panel"><h2>Laboratorio de estrategias</h2>
    <p class="sub">Elige activos, arma reglas de compra y venta con distintos indicadores y compara el resultado con comprar y mantener en varios plazos. Solo posiciones compradas. La señal se toma al cierre y se ejecuta en la apertura siguiente.</p>
    <div class="lab-top">
      <label>Partir de <select id="lpre"><option value="">Elegir plantilla…</option>${LAB_PRESETS.map(([k, l]) => `<option value="${k}">${l}</option>`).join('')}</select></label>
      <label>Moneda <span class="seg" id="lcur"><button data-c="USD" aria-pressed="${LAB.cur === 'USD'}">Dólares</button><button data-c="CLP" aria-pressed="${LAB.cur === 'CLP'}">Pesos</button></span></label>
      <label>Velas <span class="seg" id="ltf"><button data-v="d" aria-pressed="${LAB.tf === 'd'}">Diarias (2 años)</button><button data-v="w" aria-pressed="${LAB.tf === 'w'}">Semanales (10 años)</button></span></label>
    </div>
    <h3 class="lab-h">Activos <button class="lnk" id="lall">todos</button> <button class="lnk" id="lnone">ninguno</button></h3>
    <div class="lab-assets">${ORDER.map(t => `<label class="chip"><input type="checkbox" value="${t}" ${LAB.assets.includes(t) ? 'checked' : ''}> ${t}</label>`).join('')}</div>
    <div class="grid-rules">
      ${labRuleBox('entry', 'Compra cuando…', 'Se compra en la apertura siguiente a la barra en que se cumplen.')}
      ${labRuleBox('exit', 'Vende cuando…', 'Si no hay condiciones de venta, vende cuando las condiciones de compra dejan de cumplirse.')}
    </div>
    <div class="lab-top">
      <label title="Vende si el precio cae este % bajo el precio de compra">Stop de pérdida <input type="number" step="any" min="0" class="lab-n" id="lstop" value="${esc(LAB.stop)}"> %</label>
      <label title="Vende si el precio cae este % desde el máximo alcanzado durante la operación">Stop móvil <input type="number" step="any" min="0" class="lab-n" id="ltrail" value="${esc(LAB.trail)}"> %</label>
      <label title="Vende si el precio sube este % sobre el precio de compra">Toma de ganancia <input type="number" step="any" min="0" class="lab-n" id="ltp" value="${esc(LAB.tp)}"> %</label>
      <label title="Comisión y deslizamiento por cada compra o venta">Costo por operación <input type="number" step="any" min="0" class="lab-n" id="lcost" value="${esc(LAB.cost)}"> %</label>
      <button class="btn" id="llink">Copiar enlace a esta prueba</button>
    </div>
    <details class="lab-guide"><summary>Guía de indicadores: base, uso y qué indica cada uno</summary>
      <p class="sub" style="margin-top:8px">${esc(LAB_MODES_INFO)}</p>
      ${Object.entries(LAB_DEFS).map(([k, d]) => `<details class="lab-info"><summary>${esc(d.name)}</summary>${labInfoHtml(k)}</details>`).join('')}
    </details>
  </section>
  <section class="panel" id="lres"><p class="empty">Calculando…</p></section>
  <section class="panel" id="ldet" hidden></section>`;
  labWire(view); labCompute();
  rerender = () => labCompute();
}

function labWire(view) {
  const re = () => { labSave(); renderLab(view) };
  view.querySelector('#lpre').onchange = e => { if (!e.target.value) return; Object.assign(LAB, labFromPreset(e.target.value)); re() };
  view.querySelector('#lcur').onclick = e => { const b = e.target.closest('button'); if (!b) return; LAB.cur = b.dataset.c; re() };
  view.querySelector('#ltf').onclick = e => { const b = e.target.closest('button'); if (!b) return; LAB.tf = b.dataset.v; re() };
  view.querySelector('.lab-assets').onchange = () => { LAB.assets = [...view.querySelectorAll('.lab-assets input:checked')].map(x => x.value); if (LAB.sel && !LAB.assets.includes(LAB.sel)) LAB.sel = null; labSave(); labCompute() };
  view.querySelector('#lall').onclick = () => { LAB.assets = [...ORDER]; re() };
  view.querySelector('#lnone').onclick = () => { LAB.assets = []; re() };
  for (const [id, k] of [['lstop', 'stop'], ['ltrail', 'trail'], ['ltp', 'tp'], ['lcost', 'cost']]) view.querySelector('#' + id).oninput = e => { LAB[k] = e.target.value; labSave(); labSoon() };
  view.querySelectorAll('[data-all]').forEach(s => s.onclick = e => { const b = e.target.closest('button'); if (!b) return; LAB[s.dataset.all].all = b.dataset.v === '1'; re() });
  view.querySelectorAll('[data-add]').forEach(b => b.onclick = () => { const side = b.dataset.add; const prev = LAB[side].c[LAB[side].c.length - 1]; LAB[side].c.push(labCond({ k: prev ? prev.k : 'pma', op: side === 'exit' ? 'dn' : undefined })); if (!LAB_DEFS[LAB[side].c.at(-1).k].ops.some(o => o[0] === LAB[side].c.at(-1).op)) LAB[side].c.at(-1).op = LAB_DEFS[LAB[side].c.at(-1).k].ops[0][0]; re() });
  view.querySelectorAll('[data-del]').forEach(b => b.onclick = () => { LAB[b.dataset.side].c.splice(+b.dataset.del, 1); re() });
  view.querySelectorAll('.lab-cond select, .lab-cond input').forEach(el => {
    const ev = el.tagName === 'INPUT' ? 'oninput' : 'onchange';
    el[ev] = () => {
      const c = LAB[el.dataset.side].c[+el.dataset.ci];
      if (el.dataset.f === 'k') { LAB[el.dataset.side].c[+el.dataset.ci] = labCond({ k: el.value }); re(); return }
      if (el.dataset.f === 'op') c.op = el.value; else if (el.dataset.f === 'm') c.m = el.value;
      else if (el.dataset.p) c.p[el.dataset.p] = el.tagName === 'SELECT' ? el.value : (el.value === '' ? c.p[el.dataset.p] : +el.value);
      labSave(); labSoon();
    };
  });
  view.querySelector('#llink').onclick = async e => {
    const url = location.href.split('#')[0] + '#lab?c=' + btoa(unescape(encodeURIComponent(JSON.stringify(LAB))));
    try { await navigator.clipboard.writeText(url); e.target.textContent = 'Enlace copiado' } catch (_) { prompt('Copia este enlace:', url) }
  };
}
function labSoon() { clearTimeout(labTimer); labTimer = setTimeout(labCompute, 250) }

async function labCompute() {
  const box = document.getElementById('lres'); if (!box) return;
  const cfg = LAB;
  if (!cfg.assets.length) { box.innerHTML = '<p class="empty">Elige al menos un activo.</p>'; document.getElementById('ldet').hidden = true; return }
  if (!cfg.entry.c.length) { box.innerHTML = '<p class="empty">Agrega al menos una condición de compra.</p>'; document.getElementById('ldet').hidden = true; return }
  const miss = cfg.assets.filter(t => !cacheT[t]).concat(cfg.cur === 'CLP' && !cacheT.USDCLP ? ['USDCLP'] : []);
  if (miss.length) { box.innerHTML = '<p class="empty">Cargando datos…</p>'; await Promise.all(miss.map(t => getJSON('data/' + t + '.json').then(d => { cacheT[t] = d }).catch(() => { }))) }
  if (curRoute !== 'lab' || cfg !== LAB) return;
  labRes = {};
  for (const t of cfg.assets) { if (!cacheT[t]) continue; try { const r = labRunAsset(t, cfg); if (r) labRes[t] = r } catch (e) { console.error(t, e) } }
  const W = LAB_WINS[cfg.tf], ts = cfg.assets.filter(t => labRes[t]);
  let beat = 0, tot = 0;
  const avg = {}; for (const [k] of W) { const xs = ts.map(t => labRes[t].res[k]).filter(Boolean); if (xs.length) avg[k] = { ret: xs.reduce((a, b) => a + b.ret, 0) / xs.length, bh: xs.reduce((a, b) => a + b.bh, 0) / xs.length, n: xs.length }; for (const x of xs) { tot++; if (x.ret > x.bh) beat++ } }
  const cell = r => r ? `<td><span class="num ${cls(r.ret)}">${pct(r.ret)}</span><span class="rb">B&amp;H ${pct(r.bh)} · ${r.trades} op.</span></td>` : '<td class="muted">–</td>';
  const nowTxt = r => { const st = r.state, open = Object.values(r.res).slice(-1)[0]?.open; return open ? (st.inX ? '<span class="sig sig-sell">VENTA</span>' : '<span class="sig sig-long">Comprado</span>') : (st.inE ? '<span class="sig sig-buy">COMPRA</span>' : '<span class="sig sig-flat">Fuera</span>') };
  box.innerHTML = `<div class="row"><h2>Resultados</h2><span class="muted" style="font-size:.8rem">La estrategia supera a comprar y mantener en <b>${beat} de ${tot}</b> casos (activo × plazo).</span></div>
    <p class="sub">Retorno de la estrategia y, debajo, el de comprar y mantener (B&amp;H) en el mismo plazo${cfg.cur === 'CLP' && cacheT.USDCLP ? ', medidos en pesos chilenos: incluyen la variación del dólar. Las señales usan el precio en dólares' : cfg.cur === 'CLP' ? ', en dólares porque todavía no está descargado el valor del dólar en pesos' : ', en dólares'}. Cada plazo parte sin posición. La columna "Hoy" dice qué indica la regla con la última vela. Clic en una fila para ver el detalle.</p>
    <div class="tablebox"><table><thead><tr><th>Activo</th><th style="text-align:left">Hoy</th>${W.map(([, l]) => `<th>${l}</th>`).join('')}</tr></thead><tbody>
    ${ts.map(t => `<tr data-t="${t}" ${cfg.sel === t ? 'style="background:var(--accent-soft)"' : ''}><td><span class="tk">${t}</span><span class="rb">${esc(RUBRO[t] || '')}</span></td><td style="text-align:left">${nowTxt(labRes[t])}</td>${W.map(([k]) => cell(labRes[t].res[k])).join('')}</tr>`).join('')}
    ${ts.length > 1 ? `<tr style="cursor:default;font-weight:600"><td>Promedio</td><td></td>${W.map(([k]) => avg[k] ? `<td><span class="num ${cls(avg[k].ret)}">${pct(avg[k].ret)}</span><span class="rb">B&amp;H ${pct(avg[k].bh)}</span></td>` : '<td>–</td>').join('')}</tr>` : ''}
    </tbody></table></div>
    ${cfg.assets.filter(t => !labRes[t]).length ? `<p class="note">Sin datos suficientes: ${cfg.assets.filter(t => !labRes[t]).join(', ')}.</p>` : ''}
    <p class="note">Resultados pasados no garantizan resultados futuros. Las velas en curso (hoy o esta semana) pueden cambiar hasta el cierre.</p>`;
  box.querySelector('tbody').onclick = e => { const tr = e.target.closest('tr[data-t]'); if (!tr) return; cfg.sel = tr.dataset.t; labSave(); labCompute(); setTimeout(() => document.getElementById('ldet').scrollIntoView({ behavior: 'smooth', block: 'start' }), 50) };
  if (!cfg.sel || !labRes[cfg.sel]) cfg.sel = ts[0];
  labDetail();
}

const i0Of = r => r.i0;
function labDetail() {
  const box = document.getElementById('ldet'); const cfg = LAB, t = cfg.sel, R = labRes[t];
  clearCharts();
  if (!R) { box.hidden = true; return }
  box.hidden = false;
  const W = LAB_WINS[cfg.tf].filter(([k]) => R.res[k]); if (!R.res[cfg.win]) cfg.win = W[W.length - 1][0];
  const r = R.res[cfg.win], S = R.S, kd = d => R.K ? R.K[S.d.indexOf(d)] : 1;
  const pN = x => x == null ? '–' : pct(x);
  box.innerHTML = `<div class="row"><h2>${t} <span class="muted" style="font-size:.85rem;font-weight:400">${esc(RUBRO[t] || '')}</span></h2>
    <div class="seg" id="lwin">${W.map(([k, l]) => `<button data-v="${k}" aria-pressed="${k === cfg.win}">${l}</button>`).join('')}</div></div>
    <p class="sub">Desde ${fdate(r.from)} hasta ${fdate(S.d[S.d.length - 1])}, con velas ${cfg.tf === 'd' ? 'diarias' : 'semanales'}. Precios y rentabilidades en ${cfg.cur === 'CLP' && R.K ? `pesos (dólar de ${fmt(R.K[i0Of(r)], 0)} a ${fmt(R.K[R.K.length - 1], 0)})` : 'dólares'}.</p>
    <div class="chart" id="lpc" style="height:380px"></div>
    <div class="legend" id="lleg"></div>
    <div class="grid2" style="margin-top:16px"><div><p class="sub" style="margin:0 0 4px">Capital de la estrategia vs comprar y mantener (base 100)</p><div class="chart sm" id="lec" style="height:200px"></div></div>
    <div class="levels" style="align-content:start">${[['Retorno estrategia', pN(r.ret)], ['Comprar y mantener', pN(r.bh)], ['Operaciones', r.trades], ['% ganadoras', r.win == null ? '–' : fmt(r.win * 100, 0) + '%'], ['Promedio por operación', pN(r.avg)], ['Profit factor', r.pf == null ? '–' : fmt(r.pf, 2)], ['Caída máxima', pN(r.dd)], ['Caída máx. B&H', pN(r.bhdd)], ['Tiempo invertido', fmt(r.expo * 100, 0) + '%'], ['Operación abierta', r.open ? pN(r.open.ret) : 'ninguna']].map(([l, v]) => `<div><span class="muted">${l}</span><span class="num">${v}</span></div>`).join('')}</div></div>
    <h3 class="sub" style="margin:16px 0 6px;color:var(--ink);font-weight:600">Operaciones del período</h3>
    <div class="tablebox"><table><thead><tr><th>Compra</th><th>Precio</th><th>Venta</th><th>Precio</th><th>Motivo</th><th>Resultado</th></tr></thead><tbody>
    ${r.open ? `<tr style="cursor:default"><td>${fdate(r.open.in)}</td><td class="num">${fmt(r.open.pin * kd(r.open.in))}</td><td class="muted">abierta</td><td class="num">${fmt(S.c[S.c.length - 1] * kd(S.d[S.d.length - 1]))}</td><td></td><td class="num ${cls(r.open.ret)}">${pct(r.open.ret)}</td></tr>` : ''}
    ${[...r.list].reverse().map(x => `<tr style="cursor:default"><td>${fdate(x.in)}</td><td class="num">${fmt(x.pin * kd(x.in))}</td><td>${fdate(x.out)}</td><td class="num">${fmt(x.pout * kd(x.out))}</td><td>${{ regla: 'regla de venta', stop: 'stop', objetivo: 'toma de ganancia' }[x.why]}</td><td class="num ${cls(x.ret)}">${pct(x.ret)}</td></tr>`).join('') || (r.open ? '' : '<tr><td colspan="6" class="muted">Sin operaciones en el período.</td></tr>')}
    </tbody></table></div>`;
  box.querySelector('#lwin').onclick = e => { const b = e.target.closest('button'); if (!b) return; cfg.win = b.dataset.v; labSave(); labDetail() };
  const i0 = r.i0, ds = S.d.slice(i0), upc = css('--up'), dnc = css('--down');
  const ch = mk(box.querySelector('#lpc')); const cs = ch.addCandlestickSeries({ upColor: upc, downColor: dnc, borderUpColor: upc, borderDownColor: dnc, wickUpColor: upc, wickDownColor: dnc });
  const px = j => R.K ? R.K[j] : 1;
  cs.setData(ds.map((d, j) => ({ time: d, open: S.o[i0 + j] * px(i0 + j), high: S.h[i0 + j] * px(i0 + j), low: S.l[i0 + j] * px(i0 + j), close: S.c[i0 + j] * px(i0 + j) })));
  const lines = labLines(S, cfg), leg = [];
  lines.forEach(([n, v], j) => { const col = PALETTE[(j + 1) % PALETTE.length]; const s = ch.addLineSeries({ color: col, lineWidth: 1.5, priceLineVisible: false, lastValueVisible: false, crosshairMarkerVisible: false }); s.setData(ds.map((d, k) => v[i0 + k] == null ? null : { time: d, value: v[i0 + k] * px(i0 + k) }).filter(Boolean)); leg.push(`<span><i style="background:${col}"></i>${esc(n)}</span>`) });
  box.querySelector('#lleg').innerHTML = leg.join('') + '<span>▲ compra · ▼ venta</span>';
  cs.setMarkers(r.ev.map(e => ({ time: e.d, position: e.t === 'buy' ? 'belowBar' : 'aboveBar', color: e.t === 'buy' ? upc : dnc, shape: e.t === 'buy' ? 'arrowUp' : 'arrowDown', text: (e.t === 'buy' ? 'C ' : 'V ') + fmt(e.p * px(S.d.indexOf(e.d))) })));
  ch.timeScale().fitContent();
  const ec = mk(box.querySelector('#lec'));
  const es = ec.addLineSeries({ color: css('--accent'), lineWidth: 2, priceLineVisible: false }); es.setData(r.eq.map((v, j) => ({ time: ds[j], value: v * 100 })));
  const kk = j => R.K ? R.K[i0 + j] / R.K[i0] : 1;
  const bh = ec.addLineSeries({ color: css('--muted'), lineWidth: 1, lineStyle: 2, priceLineVisible: false }); bh.setData(ds.map((d, j) => ({ time: d, value: S.c[i0 + j] * kk(j) / S.o[i0] * 100 })));
  ec.timeScale().fitContent();
}

// ---------- Ranking de combinaciones (data/ranking.json, lo genera scripts/ranking.js) ----------
let RANK = null, rkTf = 'd', rkWin = 'all', rkSort = 'rel';
const RK_WINS = { d: [['all', 'Todos los plazos'], ['6m', '6 meses'], ['12m', '12 meses'], ['18m', '18 meses'], ['24m', '24 meses']],
  w: [['all', 'Todos los plazos'], ['1a', '1 año'], ['3a', '3 años'], ['5a', '5 años'], ['10a', '10 años'], ['2020', 'Año 2020'], ['2022', 'Año 2022']] };
const RK_SORTS = [['rel', 'Rentabilidad frente a comprar y mantener'], ['beat', 'Casos en que supera a comprar y mantener'], ['risk', 'Casos con mejor retorno por unidad de caída'], ['dd', 'Menor caída máxima']];
function labLink(cfg) { return '#lab?c=' + btoa(unescape(encodeURIComponent(JSON.stringify(cfg)))) }
async function renderRanking(view) {
  if (!RANK) { view.innerHTML = '<p class="empty">Cargando ranking…</p>'; try { RANK = await getJSON('data/ranking.json') } catch (e) { view.innerHTML = '<p class="empty">Todavía no hay ranking calculado.</p>'; return } if (curRoute !== 'ranking') return }
  if (!RK_WINS[rkTf].some(x => x[0] === rkWin)) rkWin = 'all';
  const key = { rel: x => x.rel, beat: x => x.beat / x.n, risk: x => x.risk / x.n, dd: x => x.dd }[rkSort];
  const G = s => (s[rkTf] || {})[rkWin];
  const L = RANK.list.filter(s => G(s) && G(s).n).sort((a, b) => key(G(b)) - key(G(a)));
  const pos = L.filter(s => G(s).rel > 0).length, bh = L[0] ? G(L[0]) : null;
  const winLab = RK_WINS[rkTf].find(x => x[0] === rkWin)[1].toLowerCase();
  const nA = rkTf === 'w' ? (RANK.assetsW || RANK.assets).length : RANK.assets.length;
  view.innerHTML = `<section class="panel"><h2>Ranking de combinaciones</h2>
    <p class="sub">${RANK.list.length} combinaciones del Laboratorio probadas en ${nA} activos hasta el ${fdate(RANK.to)}. ${rkTf === 'd' ? 'Velas diarias, plazos de 6 a 24 meses.' : 'Velas semanales: los períodos de cada indicador se cuentan en semanas (una SMA 50 semanal equivale a unos 250 días). Plazos de 1 a 10 años y los años 2020 (caída por la pandemia y rebote) y 2022 (mercado bajista). Los activos con menos historia entran solo en los plazos que alcanzan a cubrir.'} Se recalcula cada día al cierre.</p>
    <div class="lab-top"><span class="seg" id="rkt"><button data-v="d" aria-pressed="${rkTf === 'd'}">Diarias (2 años)</button><button data-v="w" aria-pressed="${rkTf === 'w'}">Semanales (10 años)</button></span>
      <span class="seg" id="rkw" style="flex-wrap:wrap">${RK_WINS[rkTf].map(([k, l]) => `<button data-v="${k}" aria-pressed="${k === rkWin}">${l}</button>`).join('')}</span>
      <label>Ordenar por <select id="rks">${RK_SORTS.map(([k, l]) => `<option value="${k}" ${k === rkSort ? 'selected' : ''}>${l}</option>`).join('')}</select></label></div>
    <p class="note" style="margin-bottom:10px"><b>${pos ? `${pos} combinaciones le ganan` : 'Ninguna combinación le gana'} a comprar y mantener en ${rkWin === 'all' ? 'el conjunto de plazos' : /^20/.test(rkWin) ? 'el ' + winLab : 'el plazo de ' + winLab}.</b> Comprar y mantener rindió una mediana de ${pct(bh && bh.bh)} por activo, con una caída máxima mediana de ${pct(bh && bh.bhdd)}.</p>
    <div class="tablebox"><table><thead><tr><th>#</th><th style="text-align:left">Combinación</th><th title="Promedio geométrico de (1 + estrategia) / (1 + comprar y mantener) en todos los activos y plazos">vs comprar y mantener</th><th title="Activos × plazos en que la estrategia rinde más">Supera</th><th title="Activos × plazos con mejor retorno dividido por caída máxima">Mejor ret./caída</th><th>Retorno mediano</th><th>Caída mediana</th><th>Op. por activo</th><th>Invertido</th><th></th></tr></thead><tbody>
    ${L.map((s, i) => { const x = G(s); const cfg = { ...s.cfg, tf: rkTf, assets: rkTf === 'w' ? (RANK.assetsW || RANK.assets) : RANK.assets, sel: null, win: rkTf === 'd' ? (rkWin === 'all' ? '24m' : rkWin) : (/^\d+a$/.test(rkWin) ? rkWin : '10a') };
      return `<tr style="cursor:default"><td class="num muted">${i + 1}</td><td style="text-align:left;white-space:normal;min-width:220px">${esc(s.name)}<span class="rb">${esc(s.group)}</span></td>
      <td class="num ${cls(x.rel)}">${pct(x.rel)}</td><td class="num">${x.beat} de ${x.n}<span class="rb">${fmt(x.beat / x.n * 100, 0)}%</span></td><td class="num">${x.risk} de ${x.n}<span class="rb">${fmt(x.risk / x.n * 100, 0)}%</span></td>
      <td class="num ${cls(x.ret)}">${pct(x.ret)}<span class="rb">B&amp;H ${pct(x.bh)}</span></td><td class="num">${pct(x.dd)}<span class="rb">B&amp;H ${pct(x.bhdd)}</span></td><td class="num">${fmt(x.tr, 1)}</td><td class="num">${fmt(x.expo * 100, 0)}%</td>
      <td><a class="btn" style="text-decoration:none;white-space:nowrap" href="${labLink(cfg)}">Abrir</a></td></tr>` }).join('')}
    </tbody></table></div>
    <p class="note"><b>Cómo leerlo.</b> "vs comprar y mantener" compara cuánto terminarías teniendo con la estrategia frente a comprar y mantener, promediado en forma geométrica para que un activo que sube 4.000% no domine el resultado: −10% significa terminar en promedio con un 10% menos de capital. "Supera" cuenta los casos (activo × plazo) en que la estrategia rinde más. "Mejor ret./caída" cuenta los casos en que gana más por cada punto de caída máxima. Retorno y caída son medianas por activo. "Abrir" carga la combinación en el Laboratorio con todos los activos.</p>
    <p class="note"><b>Cuidado con el sobreajuste.</b> Al probar muchas combinaciones sobre los mismos datos, la que sale primera en parte tuvo suerte. Las más confiables son las que quedan arriba en todos los plazos, no solo en uno. ${rkTf === 'd' ? 'Estos dos años fueron de subidas muy fuertes, el escenario más difícil para cualquier regla que sale del mercado.' : 'En los años 2020 y 2022 cada estrategia parte sin posición el 1 de enero; las de cruce o ruptura que esperan una señal nueva quedan favorecidas en un año que empezó cayendo.'} Resultados pasados no garantizan resultados futuros.</p></section>`;
  view.querySelector('#rkt').onclick = e => { const b = e.target.closest('button'); if (!b) return; rkTf = b.dataset.v; rkWin = 'all'; renderRanking(view) };
  view.querySelector('#rkw').onclick = e => { const b = e.target.closest('button'); if (!b) return; rkWin = b.dataset.v; renderRanking(view) };
  view.querySelector('#rks').onchange = e => { rkSort = e.target.value; renderRanking(view) };
  rerender = () => { };
}

let rerender=()=>{},curRoute=null;
function route(){const h=location.hash.replace('#','').split('?')[0];const t=ORDER.includes(h)||h==='senales'||h==='lab'||h==='ranking'?h:'resumen';curRoute=t;renderNav(t);clearCharts();const v=document.getElementById('view');
  document.getElementById('asof').textContent='al '+fdate(ORDER.map(x=>M[x].lastDate).sort().pop());
  if(t==='resumen')renderSummary(v);else if(t==='senales')renderSignals(v);else if(t==='lab')renderLab(v);else if(t==='ranking')renderRanking(v);else renderAsset(v,t)}
window.addEventListener('hashchange',()=>{route();window.scrollTo(0,0)});
const rerun=()=>{try{rerender()}catch(e){}};
try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',rerun)}catch(e){}
new MutationObserver(rerun).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
async function load(){
  try{SUM=await getJSON('data/summary.json')}catch(e){setStatus('bad','Aún no hay datos. En GitHub, abre la pestaña Actions y ejecuta "Actualizar datos".');document.getElementById('view').innerHTML='<p class="empty">Sin datos todavía.</p>';return false}
  ORDER=ALL.filter(t=>SUM.tickers[t]&&SUM.tickers[t].closes&&SUM.tickers[t].closes.length>1);computeMetrics();freshness();SIG=await getJSON('data/signals.json').catch(()=>null);return true}
async function refresh(){const before=SUM&&SUM.updated;try{const s=await getJSON('data/summary.json');if(s.updated!==before){const prevA=newAlerts();SIG=await getJSON('data/signals.json').catch(()=>SIG);for(const k in cacheS)delete cacheS[k];notifyNew(prevA);SUM=s;ORDER=ALL.filter(t=>SUM.tickers[t]&&SUM.tickers[t].closes&&SUM.tickers[t].closes.length>1);for(const k in cacheT)delete cacheT[k];for(const k in cacheI)delete cacheI[k];computeMetrics();const y=window.scrollY;route();window.scrollTo(0,y)}freshness()}catch(e){}}
if(!window.LightweightCharts){document.getElementById('view').innerHTML='<p class="empty">No se pudo cargar la librería de gráficos. Recarga la página.</p>';return}
getJSON('data/planilla.json').then(p=>{PLAN=p}).catch(()=>{}).finally(async()=>{if(await load())route();setInterval(refresh,120000)});
})();
</script>
