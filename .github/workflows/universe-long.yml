name: Historia larga del universo

# Descarga 10 años de cierres del universo de momentum para estudiar la estrategia año por año.
# Se corre a mano cuando hace falta (no es parte de la actualización diaria).
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/fetch_universe.py 10y universe_long.json
      - name: Guardar en el repositorio
        run: |
          git config user.name "finanzas-bot"
          git config user.email "finanzas-bot@users.noreply.github.com"
          git add data/universe_long.json
          git commit -m "Historia larga del universo $(date -u +%Y-%m-%d)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
