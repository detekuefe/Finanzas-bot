name: Actualizar datos

on:
  schedule:
    # Cada 15 minutos de lunes a viernes entre 08:00 y 17:45 de Nueva York (premarket y sesión)
    - cron: "*/15 12-21 * * 1-5"
    # Cierre definitivo después de la sesión
    - cron: "30 22 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/fetch_data.py
      - name: Guardar datos en el repositorio
        run: |
          git config user.name "finanzas-bot"
          git config user.email "finanzas-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Actualiza datos $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
