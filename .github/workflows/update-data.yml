name: Actualizar datos

on:
  schedule:
    # Cada 5 minutos de lunes a viernes entre 08:00 y 17:55 de Nueva York (premarket y sesión).
    # GitHub no garantiza la hora exacta: en momentos de alta demanda puede atrasarse unos minutos.
    - cron: "*/5 12-21 * * 1-5"
    # Cierre definitivo después de la sesión
    - cron: "30 22 * * 1-5"
  workflow_dispatch:
  # Cambios de código: actualiza datos y publica la página
  push:
    branches: [main]
    paths-ignore: ["data/**"]

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/fetch_data.py
      - run: python scripts/strategies.py
      - name: Avisar señales nuevas por correo (issue)
        if: hashFiles('alertas.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --title "Señales $(date -u +%Y-%m-%d)" --body-file alertas.md
          rm alertas.md
      - name: Guardar datos en el repositorio
        run: |
          git config user.name "finanzas-bot"
          git config user.email "finanzas-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Actualiza datos $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi

  # Publica la página desde aquí, sin depender del límite de 10 publicaciones por hora
  # que tiene GitHub Pages cuando publica directo desde la rama. Requiere que en
  # Settings > Pages la fuente sea "GitHub Actions"; mientras no lo sea, este paso
  # falla sin afectar la descarga de datos y la página se sigue publicando desde la rama.
  deploy:
    needs: update
    runs-on: ubuntu-latest
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
