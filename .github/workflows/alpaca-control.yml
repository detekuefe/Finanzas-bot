name: "Alpaca paper: pausar o reanudar"

# Botón de emergencia para la cuenta de simulación. Se usa desde
# Actions → "Alpaca paper: pausar o reanudar" → Run workflow (o desde el botón de la página #paper).
on:
  workflow_dispatch:
    inputs:
      accion:
        description: "Qué hacer"
        required: true
        type: choice
        default: pausar  # la opción que no vende nada, por si se confirma sin mirar
        options:
          - vender_y_pausar
          - pausar
          - reanudar

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: alpaca-control
  cancel-in-progress: false

jobs:
  control:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install requests
      - env:
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: python scripts/alpaca_control.py "${{ inputs.accion }}"
      # Al iniciar o reanudar, alinea la cuenta con la regla de inmediato: con el mercado abierto compra
      # ahora; con el mercado cerrado las órdenes quedan para la apertura.
      - name: Alinear la cuenta con la regla
        if: inputs.accion == 'reanudar'
        env:
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: python scripts/alpaca_paper.py --force
      - name: Guardar estado en el repositorio
        run: |
          git config user.name "finanzas-bot"
          git config user.email "finanzas-bot@users.noreply.github.com"
          git add data/alpaca_control.json data/alpaca_paper.json
          git commit -m "Alpaca paper: ${{ inputs.accion }}"
          for i in 1 2 3; do git pull --rebase origin main && git push && break; sleep 5; done

  # Publica la página de inmediato para que #paper muestre el nuevo estado
  deploy:
    needs: control
    runs-on: ubuntu-latest
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
