name: Backtest venta por caída

# Prueba de la regla de venta por caída en el día. Solo imprime resultados en el registro.
on:
  push:
    branches: [claude/project-thread-8c711c]
    paths: [scripts/stop_backtest.py, .github/workflows/stop-backtest.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/stop_backtest.py
